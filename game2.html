<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Нейро-Код: Точка Света</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    color-scheme: dark;
    overflow: hidden;
    font-family: monospace;
    font-weight: bold;
    touch-action: none;
  }
  canvas { display: block; }
</style>
<base target="_blank">
</head>
<body>
<canvas id="c"></canvas>
<script>
// ==================== КОНФИГУРАЦИЯ ====================
const CODE_GROUPS = {
  1: ['И','С','Э'],
  2: ['А','Й','П','Т'],
  3: ['Б','З','М','Ю'],
  4: ['В','К','Ф','Я'],
  5: ['Д','Л','Х','Ы'],
  6: ['Е','О','Ц','Ь'],
  7: ['Ё','Н','Ъ'],
  8: ['Г','У','Ч','Щ'],
  9: ['Ж','Р','Ш']
};

const CODE_COLOR = {
  1: '#ff5f5f', 2: '#ffd700', 3: '#2ecc71',
  4: '#1ab8b8', 5: '#4d88ff', 6: '#7dce82',
  7: '#aaaaaa', 8: '#ff4d8f', 9: '#9b59b6'
};

const SHAPE_NAMES = ['круг', 'квадрат', 'треугольник', 'ромб'];
const SHAPES = ['circle', 'roundRect', 'triangle', 'diamond'];

function getLetterCode(letter) {
  for (let code in CODE_GROUPS) {
    const idx = CODE_GROUPS[code].indexOf(letter);
    if (idx !== -1) return { code: parseInt(code), shapeIdx: idx % 4, letter };
  }
  return null;
}

function getRandomLetter() {
  const codes = Object.keys(CODE_GROUPS);
  const code = codes[Math.floor(Math.random() * codes.length)];
  const group = CODE_GROUPS[code];
  const letter = group[Math.floor(Math.random() * group.length)];
  return getLetterCode(letter);
}

function getRandomLetterFromCode(code) {
  const group = CODE_GROUPS[code];
  return group[Math.floor(Math.random() * group.length)];
}

// ==================== CANVAS ====================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ==================== СОСТОЯНИЕ ====================
let screen = 'menu'; // menu, difficulty, runner, quiz, help, gameover
let frame = 0;
let score = 0;
let hiScore = parseInt(localStorage.getItem('nk_hi') || '0');
let lives = 5;
let deathFrame = 0;
let currentLetter = getRandomLetter();
let speedIdx = 2;
const SPEED_STEPS = [0.6, 1.0, 1.6, 2.4, 3.5];
let runStep = 0;
let worldIdx = 0;
let transitionFrame = 0;
let transitionTarget = -1;
let showHint = true;
let hintTimer = 0;
let difficulty = 1; // 1=цифры, 2=буквы, 3=цифра→буква

// Миры
const WORLDS = [
  { name: 'ПУСТЫНЯ', sky: '#1a0f00', ground: '#3d2205', ground2: '#5c3a0a', particles: '#ffaa44' },
  { name: 'ЛЕС', sky: '#0a1a0a', ground: '#1a3d1a', ground2: '#2d5c2d', particles: '#88ff88' },
  { name: 'ПОДВОДНЫЙ', sky: '#000a1a', ground: '#001a33', ground2: '#002a4d', particles: '#00ccff' },
  { name: 'ОБЛАКА', sky: '#0a1a2a', ground: '#1a2a3a', ground2: '#2a3a4a', particles: '#aaccff' },
  { name: 'ПОДЗЕМЕЛЬЕ', sky: '#0a0a0a', ground: '#1a0a1a', ground2: '#2a0a2a', particles: '#cc66ff' }
];

// Игрок (раннер)
let player = {
  x: 0, y: 0, vy: 0, onGround: true, jumps: 0,
  trail: [], flashRed: 0
};

// Объекты
let blocks = [];
let particles = [];
let hearts = [];
let orbs = [];
let lastSpawn = 0;
let spawnInterval = 120;
let heartSpawnTimer = 0;
let heartSpawnNext = 300 + Math.random() * 200;

// Квиз
let quizLevel = 1;
let quizQuestion = null;
let quizAnswered = false;
let quizWait = 0;
let quizStreak = 0;
let quizScore = 0;

// Меню орбы
for (let i = 0; i < 9; i++) {
  orbs.push({
    x: Math.random() * W, y: Math.random() * H,
    vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2,
    r: 20 + Math.random() * 15,
    code: Object.keys(CODE_GROUPS)[i],
    phase: Math.random() * Math.PI * 2
  });
}

// ==================== УТИЛИТЫ ====================
function drawShape(x, y, size, shape, color, glow) {
  ctx.save();
  ctx.fillStyle = color;
  if (glow) {
    ctx.shadowColor = color;
    ctx.shadowBlur = glow;
  }
  ctx.beginPath();
  if (shape === 'circle') {
    ctx.arc(x, y, size, 0, Math.PI * 2);
  } else if (shape === 'roundRect') {
    const r = size * 0.3;
    ctx.moveTo(x - size + r, y - size);
    ctx.lineTo(x + size - r, y - size);
    ctx.quadraticCurveTo(x + size, y - size, x + size, y - size + r);
    ctx.lineTo(x + size, y + size - r);
    ctx.quadraticCurveTo(x + size, y + size, x + size - r, y + size);
    ctx.lineTo(x - size + r, y + size);
    ctx.quadraticCurveTo(x - size, y + size, x - size, y + size - r);
    ctx.lineTo(x - size, y - size + r);
    ctx.quadraticCurveTo(x - size, y - size, x - size + r, y - size);
  } else if (shape === 'triangle') {
    ctx.moveTo(x, y - size);
    ctx.lineTo(x + size * 0.866, y + size * 0.5);
    ctx.lineTo(x - size * 0.866, y + size * 0.5);
  } else if (shape === 'diamond') {
    ctx.moveTo(x, y - size);
    ctx.lineTo(x + size * 0.7, y);
    ctx.lineTo(x, y + size);
    ctx.lineTo(x - size * 0.7, y);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawText(text, x, y, size, color, align, glow) {
  ctx.save();
  ctx.font = 'bold ' + size + 'px monospace';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  if (glow) {
    ctx.shadowColor = color;
    ctx.shadowBlur = glow;
  }
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawButton(text, x, y, w, h, color, textColor, glow) {
  ctx.save();
  ctx.fillStyle = color;
  if (glow) {
    ctx.shadowColor = glow;
    ctx.shadowBlur = 20;
  }
  ctx.beginPath();
  const r = h * 0.2;
  ctx.moveTo(x - w/2 + r, y - h/2);
  ctx.lineTo(x + w/2 - r, y - h/2);
  ctx.quadraticCurveTo(x + w/2, y - h/2, x + w/2, y - h/2 + r);
  ctx.lineTo(x + w/2, y + h/2 - r);
  ctx.quadraticCurveTo(x + w/2, y + h/2, x + w/2 - r, y + h/2);
  ctx.lineTo(x - w/2 + r, y + h/2);
  ctx.quadraticCurveTo(x - w/2, y + h/2, x - w/2, y + h/2 - r);
  ctx.lineTo(x - w/2, y - h/2 + r);
  ctx.quadraticCurveTo(x - w/2, y - h/2, x - w/2 + r, y - h/2);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  drawText(text, x, y, h * 0.4, textColor || '#fff', 'center');
}

function isInside(px, py, x, y, w, h) {
  return px >= x - w/2 && px <= x + w/2 && py >= y - h/2 && py <= y + h/2;
}

// ==================== ЧАСТИЦЫ ====================
function spawnParticles(x, y, color, count, speed) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const sp = (Math.random() * 0.5 + 0.5) * speed;
    particles.push({
      x, y, vx: Math.cos(angle) * sp, vy: Math.sin(angle) * sp,
      life: 1, color, size: 2 + Math.random() * 3
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life -= 0.02;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (let p of particles) {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0.01, p.size * p.life), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ==================== РАННЕР ЛОГИКА ====================
function initRunner() {
  score = 0;
  lives = 5;
  blocks = [];
  particles = [];
  hearts = [];
  currentLetter = getRandomLetter();
  player.x = W * 0.2;
  player.y = H * 0.75;
  player.vy = 0;
  player.onGround = true;
  player.jumps = 0;
  player.trail = [];
  player.flashRed = 0;
  runStep = 0;
  worldIdx = 0;
  lastSpawn = 0;
  spawnInterval = 120;
  heartSpawnTimer = 0;
  heartSpawnNext = 300 + Math.random() * 200;
  showHint = true;
  hintTimer = frame;
  deathFrame = 0;
}

function getPlayerDisplay() {
  if (difficulty === 1) {
    return { text: currentLetter.code.toString(), isDigit: true };
  } else if (difficulty === 2) {
    return { text: currentLetter.letter, isDigit: false };
  } else {
    return { text: currentLetter.code.toString(), isDigit: true };
  }
}

function getBlockDisplay(block) {
  if (difficulty === 1) {
    return block.code.toString();
  } else if (difficulty === 2) {
    return block.letter || block.code.toString();
  } else {
    return block.letter || block.code.toString();
  }
}

function spawnBlock() {
  const speed = (W * 0.008 + score * 0.04) * SPEED_STEPS[speedIdx];
  const baseSize = H * 0.085;
  const sizeVar = Math.random() * H * 0.04;
  const size = baseSize + sizeVar;
  const isAir = Math.random() < 0.3;
  const y = isAir ? H * 0.55 : H * 0.75;

  const r = Math.random();
  let block;

  if (r < 0.38) {
    let blockLetter;
    if (difficulty === 2 || difficulty === 3) {
      blockLetter = currentLetter.letter;
    } else {
      blockLetter = getRandomLetterFromCode(currentLetter.code);
    }
    block = {
      x: W + size, y, size,
      code: currentLetter.code,
      letter: blockLetter,
      shape: SHAPES[currentLetter.shapeIdx],
      color: CODE_COLOR[currentLetter.code],
      isCorrect: true,
      isObs: false
    };
  } else if (r < 0.6) {
    block = {
      x: W + size, y: H * 0.75, size,
      code: 0, letter: '', shape: 'roundRect', color: '#4a2e0a',
      isCorrect: false, isObs: true
    };
  } else {
    let wrongCode, wrongLetter, wrongShape;
    if (difficulty === 1) {
      wrongCode = Object.keys(CODE_GROUPS)[Math.floor(Math.random() * 9)];
      wrongLetter = getRandomLetterFromCode(wrongCode);
      wrongShape = Math.floor(Math.random() * 4);
    } else {
      const allLetters = 'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ'.split('');
      do {
        wrongLetter = allLetters[Math.floor(Math.random() * allLetters.length)];
      } while (getLetterCode(wrongLetter).code === currentLetter.code);
      const info = getLetterCode(wrongLetter);
      wrongCode = info.code;
      wrongShape = info.shapeIdx;
    }
    block = {
      x: W + size, y, size,
      code: parseInt(wrongCode),
      letter: wrongLetter,
      shape: SHAPES[wrongShape],
      color: CODE_COLOR[wrongCode],
      isCorrect: false, isObs: false
    };
  }
  blocks.push(block);
}

function spawnHeart() {
  if (lives >= 5) return;
  hearts.push({
    x: W + 30, y: H * 0.5 + Math.random() * H * 0.2,
    size: 15, phase: Math.random() * Math.PI * 2
  });
}

function updateRunner() {
  if (deathFrame > 0) {
    deathFrame--;
    if (deathFrame === 0) {
      if (score > hiScore) {
        hiScore = score;
        localStorage.setItem('nk_hi', hiScore);
      }
      screen = 'gameover';
    }
    return;
  }

  if (transitionFrame > 0) {
    transitionFrame--;
    if (transitionFrame === 0 && transitionTarget >= 0) {
      worldIdx = transitionTarget;
      transitionTarget = -1;
    }
    return;
  }

  const speed = (W * 0.008 + score * 0.04) * SPEED_STEPS[speedIdx];
  runStep += 0.15 * SPEED_STEPS[speedIdx];

  player.vy += 0.6;
  player.y += player.vy;

  const groundY = H * 0.75 + Math.sin(runStep) * 2.5;
  if (player.y >= groundY) {
    if (!player.onGround && player.y > groundY + 5) {
      spawnParticles(player.x, player.y + 10, '#aaa', 6, 2);
    }
    player.y = groundY;
    player.vy = 0;
    player.onGround = true;
    player.jumps = 0;
  } else {
    player.onGround = false;
  }

  player.trail.push({ x: player.x, y: player.y, size: 6 });
  if (player.trail.length > 18) player.trail.shift();
  for (let i = 0; i < player.trail.length; i++) {
    player.trail[i].x -= speed * 0.5;
    player.trail[i].size *= 0.95;
  }

  lastSpawn++;
  const currentInterval = Math.max(40, spawnInterval / SPEED_STEPS[speedIdx]);
  if (lastSpawn > currentInterval) {
    spawnBlock();
    lastSpawn = 0;
  }

  heartSpawnTimer++;
  if (heartSpawnTimer > heartSpawnNext) {
    spawnHeart();
    heartSpawnTimer = 0;
    heartSpawnNext = 300 + Math.random() * 200;
  }

  for (let i = blocks.length - 1; i >= 0; i--) {
    let b = blocks[i];
    b.x -= speed;

    const dx = player.x - b.x;
    const dy = player.y - b.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < b.size + 15) {
      if (b.isObs) {
        lives--;
        player.flashRed = 20;
        spawnParticles(player.x, player.y, '#ff0000', 15, 4);
        blocks.splice(i, 1);
        if (lives <= 0) deathFrame = 20;
      } else if (b.isCorrect) {
        score += 10;
        spawnParticles(b.x, b.y, '#ffd700', 20, 5);
        currentLetter = getRandomLetter();
        blocks.splice(i, 1);
      } else {
        lives--;
        player.flashRed = 20;
        spawnParticles(player.x, player.y, '#ff0000', 15, 4);
        blocks.splice(i, 1);
        if (lives <= 0) deathFrame = 20;
      }
      continue;
    }

    if (b.x < -100) blocks.splice(i, 1);
  }

  for (let i = hearts.length - 1; i >= 0; i--) {
    let h = hearts[i];
    h.x -= speed * 0.8;
    h.phase += 0.05;
    h.y += Math.sin(h.phase) * 0.5;

    const dx = player.x - h.x;
    const dy = player.y - h.y;
    if (Math.sqrt(dx*dx + dy*dy) < h.size + 20) {
      lives = Math.min(5, lives + 1);
      spawnParticles(h.x, h.y, '#ff69b4', 12, 3);
      hearts.splice(i, 1);
      continue;
    }

    if (h.x < -50) hearts.splice(i, 1);
  }

  if (showHint && frame - hintTimer > 300) {
    showHint = false;
  }

  if (score > 0 && score % 200 === 0 && blocks.length > 0) {
    const lastBlock = blocks[blocks.length - 1];
    if (lastBlock.x < W * 0.5 && transitionFrame === 0) {
      const newWorld = Math.floor(Math.random() * WORLDS.length);
      if (newWorld !== worldIdx) {
        transitionTarget = newWorld;
        transitionFrame = 66;
      }
    }
  }
}

function drawRunner() {
  const world = WORLDS[worldIdx];

  ctx.fillStyle = world.sky;
  ctx.fillRect(0, 0, W, H);

  if (worldIdx === 2) {
    ctx.save();
    ctx.globalAlpha = 0.1;
    for (let i = 0; i < 5; i++) {
      ctx.strokeStyle = '#00ccff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let x = 0; x < W; x += 20) {
        const y = H * 0.3 + Math.sin(x * 0.01 + frame * 0.02 + i) * 30 + i * 40;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  if (worldIdx === 3) {
    ctx.save();
    ctx.globalAlpha = 0.3;
    for (let i = 0; i < 5; i++) {
      const cx = ((frame * 0.5 + i * 200) % (W + 200)) - 100;
      const cy = H * 0.2 + Math.sin(i + frame * 0.01) * 50;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(cx, cy, 40, 0, Math.PI * 2);
      ctx.arc(cx + 30, cy - 10, 35, 0, Math.PI * 2);
      ctx.arc(cx + 60, cy, 40, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  if (worldIdx === 4) {
    ctx.save();
    ctx.globalAlpha = 0.2;
    for (let i = 0; i < 8; i++) {
      const cx = i * W / 8 + Math.sin(frame * 0.02 + i) * 20;
      const cy = H * 0.6;
      ctx.fillStyle = '#cc66ff';
      ctx.beginPath();
      ctx.moveTo(cx, cy - 40);
      ctx.lineTo(cx + 15, cy);
      ctx.lineTo(cx - 15, cy);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  ctx.fillStyle = world.ground;
  ctx.fillRect(0, H * 0.75, W, H * 0.25);
  ctx.fillStyle = world.ground2;
  ctx.fillRect(0, H * 0.75, W, 4);

  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) {
    const sx = (frame * 3 + i * 100) % W;
    const sy = H * 0.3 + i * H * 0.1;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx - 60, sy);
    ctx.stroke();
  }
  ctx.restore();

  for (let i = 0; i < player.trail.length; i++) {
    const t = player.trail[i];
    const alpha = (i / player.trail.length) * 0.5;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = CODE_COLOR[currentLetter.code];
    ctx.beginPath();
    ctx.arc(t.x, t.y, Math.max(0.01, t.size), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  ctx.save();
  if (player.flashRed > 0) {
    ctx.fillStyle = `rgba(255,0,0,${player.flashRed / 20})`;
    ctx.fillRect(0, 0, W, H);
    player.flashRed--;
  }

  const pd = getPlayerDisplay();

  ctx.shadowColor = CODE_COLOR[currentLetter.code];
  ctx.shadowBlur = 25;
  drawShape(player.x, player.y, 18, SHAPES[currentLetter.shapeIdx], CODE_COLOR[currentLetter.code]);
  ctx.shadowBlur = 0;

  // Dark halo for letter readability
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.beginPath();
  ctx.arc(player.x, player.y, 13, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  const textSize = pd.isDigit ? 16 : 20;
  drawText(pd.text, player.x, player.y, textSize, '#ffffff', 'center');
  ctx.restore();

  for (let b of blocks) {
    if (b.isObs) {
      ctx.save();
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x - b.size, b.y - b.size, b.size * 2, b.size * 2);
      drawText('✕', b.x, b.y, b.size, '#0a0a1a', 'center');
      ctx.restore();
    } else {
      drawShape(b.x, b.y, b.size * 0.7, b.shape, b.color, 10);
      const displayText = getBlockDisplay(b);
      const textSize = displayText.length === 1 ? b.size * 0.5 : b.size * 0.35;
      drawText(displayText, b.x, b.y, textSize, '#0a0a1a', 'center');
    }
  }

  for (let h of hearts) {
    ctx.save();
    ctx.fillStyle = '#ff69b4';
    ctx.shadowColor = '#ff69b4';
    ctx.shadowBlur = 10;
    const s = h.size + Math.sin(h.phase) * 3;
    ctx.font = s + 'px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('♥', h.x, h.y);
    ctx.restore();
  }

  updateParticles();
  drawParticles();

  drawRunnerHUD();

  if (transitionFrame > 0) {
    const alpha = transitionFrame > 33 ? (66 - transitionFrame) / 33 : transitionFrame / 33;
    ctx.fillStyle = `rgba(0,0,0,${alpha})`;
    ctx.fillRect(0, 0, W, H);
    if (transitionFrame > 33 && transitionTarget >= 0) {
      drawText(WORLDS[transitionTarget].name, W/2, H/2, 40, '#fff', 'center', 20);
    }
  }

  if (deathFrame > 0) {
    const flashA = Math.max(0, 0.55 * (1 - deathFrame / 20));
    ctx.fillStyle = `rgba(255,0,0,${flashA})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawRunnerHUD() {
  const cellW = W / 9;
  const cellH = H * 0.08;
  for (let i = 0; i < 9; i++) {
    const code = i + 1;
    const isCurrent = code === currentLetter.code;
    const x = i * cellW + cellW / 2;
    const y = cellH / 2 + 10;

    ctx.save();
    if (isCurrent) {
      ctx.shadowColor = CODE_COLOR[code];
      ctx.shadowBlur = 20;
      ctx.fillStyle = CODE_COLOR[code] + '44';
    } else {
      ctx.fillStyle = '#1a1a2e';
    }
    ctx.fillRect(i * cellW + 2, 2, cellW - 4, cellH);
    ctx.restore();

    drawText(code, x, y - 8, 14, isCurrent ? CODE_COLOR[code] : '#666', 'center', isCurrent ? 10 : 0);
    drawText(CODE_GROUPS[code].join(' '), x, y + 10, 10, isCurrent ? '#fff' : '#444', 'center');
  }

  let hintText;
  if (difficulty === 1) {
    hintText = `ТВОЯ БУКВА ${currentLetter.letter} → ИЩЕШЬ КОД ${currentLetter.code}`;
  } else if (difficulty === 2) {
    hintText = `ТВОЙ КОД ${currentLetter.code} → ИЩЕШЬ БУКВУ ${currentLetter.letter}`;
  } else {
    hintText = `ТВОЙ КОД ${currentLetter.code} → НАЙДИ БУКВУ ИЗ ЭТОЙ ГРУППЫ`;
  }
  drawText(hintText, W/2, cellH + 25, 14, '#fff', 'center', 5);

  drawText(`ОЧКИ: ${score}`, 20, 30, 16, '#ffd700', 'left');
  drawText(`РЕКОРД: ${hiScore}`, 20, 50, 12, '#888', 'left');

  const diffNames = ['', 'ЦИФРЫ', 'БУКВЫ', 'ЦИФРА→БУКВА'];
  drawText(diffNames[difficulty], W/2, 30, 12, '#666', 'center');

  let heartStr = '';
  for (let i = 0; i < lives; i++) heartStr += '♥ ';
  drawText(heartStr, W - 20, 30, 20, '#ff4444', 'right');

  drawButton('↺', 40, H - 40, 50, 40, '#ff4444', '#fff');

  drawButton('◀', W - 120, H - 40, 50, 40, '#333', '#fff');
  drawText(`${SPEED_STEPS[speedIdx].toFixed(1)}×`, W - 60, H - 40, 14, '#ffd700', 'center');
  drawButton('▶', W - 40, H - 40, 50, 40, '#333', '#fff');

  if (showHint) {
    ctx.save();
    ctx.globalAlpha = 0.7 + Math.sin(frame * 0.1) * 0.3;
    drawText('TAP / ПРОБЕЛ → ПРЫЖОК', W/2, H * 0.5, 20, '#fff', 'center', 10);
    ctx.restore();
  }
}

// ==================== ВЫБОР СЛОЖНОСТИ ====================
function drawDifficulty() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);

  drawText('ВЫБЕРИ УРОВЕНЬ', W/2, H * 0.15, 28, '#ffd700', 'center', 15);

  const btnW = 300;
  const btnH = 70;
  const startY = H * 0.3;

  drawButton('1  ЦИФРЫ', W/2, startY, btnW, btnH, '#00ff66', '#0a0a1a', 10);
  drawText('Игрок = цифра, блоки = цифры', W/2, startY + 45, 12, '#888', 'center');

  drawButton('2  БУКВЫ', W/2, startY + 100, btnW, btnH, '#00ccff', '#0a0a1a', 10);
  drawText('Игрок = буква, блоки = буквы', W/2, startY + 145, 12, '#888', 'center');

  drawButton('3  ЦИФРА→БУКВА', W/2, startY + 200, btnW, btnH, '#ff8800', '#0a0a1a', 10);
  drawText('Игрок = цифра, блоки = буквы! Переводи!', W/2, startY + 245, 12, '#888', 'center');

  drawButton('◀ МЕНЮ', 80, H - 40, 120, 40, '#333', '#fff');
}

function handleDifficulty(x, y) {
  const btnW = 300;
  const btnH = 70;
  const startY = H * 0.3;

  if (isInside(x, y, W/2, startY, btnW, btnH)) {
    difficulty = 1; initRunner(); screen = 'runner';
  } else if (isInside(x, y, W/2, startY + 100, btnW, btnH)) {
    difficulty = 2; initRunner(); screen = 'runner';
  } else if (isInside(x, y, W/2, startY + 200, btnW, btnH)) {
    difficulty = 3; initRunner(); screen = 'runner';
  } else if (isInside(x, y, 80, H - 40, 120, 40)) {
    screen = 'menu';
  }
}

// ==================== КВИЗ ЛОГИКА ====================
function initQuiz() {
  quizScore = 0;
  quizStreak = 0;
  quizAnswered = false;
  quizWait = 0;
  generateQuizQuestion();
}

function generateQuizQuestion() {
  const letters = 'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ'.split('');
  const target = letters[Math.floor(Math.random() * letters.length)];
  const info = getLetterCode(target);

  if (quizLevel === 1) {
    const options = [info.code];
    while (options.length < 4) {
      const c = Math.floor(Math.random() * 9) + 1;
      if (!options.includes(c)) options.push(c);
    }
    options.sort(() => Math.random() - 0.5);
    quizQuestion = { type: 1, target, correct: info.code, options, selected: -1 };
  } else if (quizLevel === 2) {
    const options = [target];
    while (options.length < 4) {
      const l = letters[Math.floor(Math.random() * letters.length)];
      if (!options.includes(l)) options.push(l);
    }
    options.sort(() => Math.random() - 0.5);
    quizQuestion = { type: 2, target: info, correct: target, options, selected: -1 };
  } else {
    quizQuestion = {
      type: 3, target, correctCode: info.code, correctShape: info.shapeIdx,
      selectedCode: -1, selectedShape: -1, checked: false
    };
  }
}

function updateQuiz() {
  if (quizAnswered) {
    quizWait--;
    if (quizWait <= 0) {
      quizAnswered = false;
      generateQuizQuestion();
    }
  }
}

function drawQuiz() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);

  drawText('ГОЛОВОЛОМКА', W/2, 40, 24, '#ffd700', 'center', 10);
  drawText(`Уровень: ${quizLevel === 1 ? 'ЛЁГКИЙ' : quizLevel === 2 ? 'СРЕДНИЙ' : 'СЛОЖНЫЙ'}`, W/2, 70, 14, '#888', 'center');
  drawText(`Очки: ${quizScore} | Стрик: ${quizStreak}`, W/2, 95, 14, '#fff', 'center');

  if (!quizQuestion) return;

  const q = quizQuestion;

  if (q.type === 1) {
    drawText(q.target, W/2, H * 0.25, 80, '#fff', 'center', 20);
    drawText('Выбери цифру:', W/2, H * 0.4, 16, '#888', 'center');

    const btnW = W * 0.18;
    const btnH = 60;
    const startX = W/2 - (btnW * 2 + 20);
    for (let i = 0; i < 4; i++) {
      const x = startX + i * (btnW + 15);
      const y = H * 0.5;
      let color = '#1a1a2e', glow = 0;
      if (quizAnswered) {
        if (q.options[i] === q.correct) { color = '#00ff66'; glow = 15; }
        else if (q.selected === i) { color = '#ff4444'; glow = 10; }
      } else if (q.selected === i) { color = '#333'; }
      drawButton(q.options[i].toString(), x, y, btnW, btnH, color, '#fff', glow);
    }
  } else if (q.type === 2) {
    const info = q.target;
    drawShape(W/2, H * 0.22, 50, SHAPES[info.shapeIdx], CODE_COLOR[info.code], 25);
    drawText(info.code.toString(), W/2, H * 0.22, 30, '#0a0a1a', 'center');
    drawText('Угадай букву:', W/2, H * 0.4, 16, '#888', 'center');

    const btnW = W * 0.18;
    const btnH = 60;
    const startX = W/2 - (btnW * 2 + 20);
    for (let i = 0; i < 4; i++) {
      const x = startX + i * (btnW + 15);
      const y = H * 0.5;
      let color = '#1a1a2e', glow = 0;
      if (quizAnswered) {
        if (q.options[i] === q.correct) { color = '#00ff66'; glow = 15; }
        else if (q.selected === i) { color = '#ff4444'; glow = 10; }
      } else if (q.selected === i) { color = '#333'; }
      drawButton(q.options[i], x, y, btnW, btnH, color, '#fff', glow);
    }
  } else if (q.type === 3) {
    drawText(q.target, W/2, H * 0.18, 80, '#fff', 'center', 20);
    drawText('Выбери цифру:', W/2, H * 0.32, 14, '#888', 'center');

    const numW = W * 0.08;
    const numStart = W/2 - (numW * 4.5 + 30);
    for (let i = 0; i < 9; i++) {
      const x = numStart + i * (numW + 8);
      const y = H * 0.38;
      let color = '#1a1a2e', glow = 0;
      if (quizAnswered) {
        if (i + 1 === q.correctCode) { color = '#00ff66'; glow = 15; }
        else if (q.selectedCode === i + 1) { color = '#ff4444'; glow = 10; }
      } else if (q.selectedCode === i + 1) { color = CODE_COLOR[i + 1]; glow = 10; }
      drawButton((i+1).toString(), x, y, numW, 40, color, '#fff', glow);
    }

    drawText('Выбери форму:', W/2, H * 0.48, 14, '#888', 'center');

    const shapeW = W * 0.2;
    const shapeStart = W/2 - (shapeW * 2 + 15);
    for (let i = 0; i < 4; i++) {
      const x = shapeStart + i * (shapeW + 10);
      const y = H * 0.58;
      let color = '#1a1a2e', glow = 0;
      if (quizAnswered) {
        if (i === q.correctShape) { color = '#00ff66'; glow = 15; }
        else if (q.selectedShape === i) { color = '#ff4444'; glow = 10; }
      } else if (q.selectedShape === i) { color = '#333'; }
      drawButton(SHAPE_NAMES[i], x, y, shapeW, 45, color, '#fff', glow);
    }

    if (!quizAnswered && q.selectedCode > 0 && q.selectedShape >= 0) {
      drawButton('ПРОВЕРИТЬ', W/2, H * 0.72, 160, 50, '#ffd700', '#0a0a1a', 15);
    }
  }

  updateParticles();
  drawParticles();

  drawButton('◀ МЕНЮ', 80, H - 40, 120, 40, '#333', '#fff');
}

// ==================== МЕНЮ ====================
function updateMenu() {
  for (let orb of orbs) {
    orb.x += orb.vx;
    orb.y += orb.vy;
    orb.phase += 0.02;
    if (orb.x < -50 || orb.x > W + 50) orb.vx *= -1;
    if (orb.y < -50 || orb.y > H + 50) orb.vy *= -1;
  }
}

function drawMenu() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);

  for (let orb of orbs) {
    const color = CODE_COLOR[orb.code];
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = 20 + Math.sin(orb.phase) * 10;
    ctx.fillStyle = color + '66';
    ctx.beginPath();
    ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    const group = CODE_GROUPS[orb.code];
    const letter = group[Math.floor(orb.phase * 0.5) % group.length];
    drawText(letter, orb.x, orb.y, orb.r * 0.6, '#fff', 'center');
  }

  drawText('НЕЙРО-КОД', W/2, H * 0.18, 36, '#ffd700', 'center', 20);
  drawText('ТОЧКА СВЕТА', W/2, H * 0.25, 24, '#fff', 'center', 10);

  const btnW = 220;
  const btnH = 55;
  const startY = H * 0.4;
  drawButton('▶ БЕГУН', W/2, startY, btnW, btnH, '#00ff66', '#0a0a1a', 10);
  drawButton('◈ ГОЛОВОЛОМКА', W/2, startY + 70, btnW, btnH, '#00ccff', '#0a0a1a', 10);
  drawButton('✦ СПРАВКА', W/2, startY + 140, btnW, btnH, '#ffd700', '#0a0a1a', 10);

  drawText(`РЕКОРД: ${hiScore}`, W/2, H * 0.78, 16, '#888', 'center');
  drawText('← вернуться в ПРАНА', W/2, H * 0.88, 14, '#666', 'center');
}

// ==================== СПРАВКА ====================
let helpScroll = 0;
let helpDragging = false;
let helpLastY = 0;

function drawHelp() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);

  drawText('СПРАВКА', W/2, 40, 24, '#ffd700', 'center', 10);
  drawText('Свайп для прокрутки', W/2, 65, 12, '#666', 'center');

  const colW = W / 3;
  const rowH = 45;
  const startY = 100 - helpScroll;

  drawText('БУКВА', colW * 0.5, startY, 14, '#ffd700', 'center');
  drawText('ЦИФРА', colW * 1.5, startY, 14, '#ffd700', 'center');
  drawText('ФИГУРА', colW * 2.5, startY, 14, '#ffd700', 'center');

  const allLetters = 'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ'.split('');
  for (let i = 0; i < allLetters.length; i++) {
    const y = startY + 30 + i * rowH;
    if (y < -20 || y > H + 20) continue;

    const info = getLetterCode(allLetters[i]);
    if (!info) continue;

    ctx.fillStyle = i % 2 === 0 ? '#111122' : '#0a0a1a';
    ctx.fillRect(0, y - rowH/2, W, rowH);

    drawText(info.letter, colW * 0.5, y, 18, '#fff', 'center');
    drawText(info.code.toString(), colW * 1.5, y, 18, CODE_COLOR[info.code], 'center');
    drawText(SHAPE_NAMES[info.shapeIdx], colW * 2.5, y, 14, '#888', 'center');
  }

  drawButton('◀ МЕНЮ', 80, H - 40, 120, 40, '#333', '#fff');
}

// ==================== GAME OVER ====================
function drawGameOver() {
  ctx.fillStyle = 'rgba(10,10,26,0.95)';
  ctx.fillRect(0, 0, W, H);

  drawText('ИГРА ОКОНЧЕНА', W/2, H * 0.3, 32, '#ff4444', 'center', 20);
  drawText(`СЧЁТ: ${score}`, W/2, H * 0.42, 24, '#fff', 'center');
  drawText(`РЕКОРД: ${hiScore}`, W/2, H * 0.52, 18, '#ffd700', 'center');

  const diffNames = ['', 'ЦИФРЫ', 'БУКВЫ', 'ЦИФРА→БУКВА'];
  drawText(`Уровень: ${diffNames[difficulty]}`, W/2, H * 0.58, 14, '#888', 'center');

  drawButton('↺ НАЧАТЬ ЗАНОВО', W/2, H * 0.68, 280, 60, '#ffd700', '#0a0a1a', 20);
  drawButton('◀ МЕНЮ', W/2, H * 0.8, 160, 45, '#333', '#fff');

  drawText('Тап вне кнопки = рестарт', W/2, H * 0.9, 12, '#666', 'center');
}

// ==================== УПРАВЛЕНИЕ ====================
function jump() {
  if (screen !== 'runner' || deathFrame > 0 || transitionFrame > 0) return;
  if (player.jumps < 2) {
    player.vy = -12;
    player.jumps++;
    player.onGround = false;
  }
}

function restartRunner() {
  initRunner();
  screen = 'runner';
}

function handlePointer(x, y) {
  if (screen === 'menu') {
    const btnW = 220, btnH = 55, startY = H * 0.4;
    if (isInside(x, y, W/2, startY, btnW, btnH)) {
      screen = 'difficulty';
    } else if (isInside(x, y, W/2, startY + 70, btnW, btnH)) {
      initQuiz(); screen = 'quiz';
    } else if (isInside(x, y, W/2, startY + 140, btnW, btnH)) {
      screen = 'help'; helpScroll = 0;
    } else if (y > H * 0.85) {
      window.location.href = 'index.html';
    }
  } else if (screen === 'difficulty') {
    handleDifficulty(x, y);
  } else if (screen === 'runner') {
    if (isInside(x, y, 40, H - 40, 50, 40)) { restartRunner(); return; }
    if (isInside(x, y, W - 120, H - 40, 50, 40)) { speedIdx = Math.max(0, speedIdx - 1); return; }
    if (isInside(x, y, W - 40, H - 40, 50, 40)) { speedIdx = Math.min(4, speedIdx + 1); return; }
    jump();
  } else if (screen === 'quiz') {
    if (isInside(x, y, 80, H - 40, 120, 40)) { screen = 'menu'; return; }
    if (quizAnswered) return;

    const q = quizQuestion;
    if (q.type === 1 || q.type === 2) {
      const btnW = W * 0.18, btnH = 60;
      const startX = W/2 - (btnW * 2 + 20);
      for (let i = 0; i < 4; i++) {
        const bx = startX + i * (btnW + 15);
        const by = H * 0.5;
        if (isInside(x, y, bx, by, btnW, btnH)) {
          q.selected = i;
          const isCorrect = q.options[i] === q.correct;
          if (isCorrect) {
            quizScore += 10; quizStreak++;
            if (quizStreak >= 2) quizScore += 10;
            spawnParticles(bx, by, '#00ff66', 15, 4);
          } else {
            quizStreak = 0;
            spawnParticles(bx, by, '#ff4444', 10, 3);
          }
          quizAnswered = true; quizWait = 65;
          break;
        }
      }
    } else if (q.type === 3) {
      const numW = W * 0.08;
      const numStart = W/2 - (numW * 4.5 + 30);
      for (let i = 0; i < 9; i++) {
        const bx = numStart + i * (numW + 8);
        if (isInside(x, y, bx, H * 0.38, numW, 40)) { q.selectedCode = i + 1; return; }
      }
      const shapeW = W * 0.2;
      const shapeStart = W/2 - (shapeW * 2 + 15);
      for (let i = 0; i < 4; i++) {
        const bx = shapeStart + i * (shapeW + 10);
        if (isInside(x, y, bx, H * 0.58, shapeW, 45)) { q.selectedShape = i; return; }
      }
      if (q.selectedCode > 0 && q.selectedShape >= 0 &&
          isInside(x, y, W/2, H * 0.72, 160, 50)) {
        const correct = q.selectedCode === q.correctCode && q.selectedShape === q.correctShape;
        if (correct) {
          quizScore += 20; quizStreak++;
          if (quizStreak >= 2) quizScore += 20;
          spawnParticles(W/2, H * 0.72, '#00ff66', 20, 5);
        } else {
          quizStreak = 0;
          spawnParticles(W/2, H * 0.72, '#ff4444', 15, 4);
        }
        quizAnswered = true; quizWait = 65;
      }
    }
  } else if (screen === 'help') {
    if (isInside(x, y, 80, H - 40, 120, 40)) screen = 'menu';
  } else if (screen === 'gameover') {
    if (isInside(x, y, W/2, H * 0.8, 160, 45)) {
      screen = 'menu';
    } else {
      restartRunner();
    }
  }
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  handlePointer(e.clientX - rect.left, e.clientY - rect.top);
  if (screen === 'help') {
    helpDragging = true;
    helpLastY = e.clientY - rect.top;
  }
});

canvas.addEventListener('pointermove', e => {
  if (screen === 'help' && helpDragging) {
    const rect = canvas.getBoundingClientRect();
    const y = e.clientY - rect.top;
    helpScroll -= (y - helpLastY);
    helpScroll = Math.max(0, Math.min(helpScroll, 33 * 45 - H + 150));
    helpLastY = y;
  }
});

canvas.addEventListener('pointerup', () => { helpDragging = false; });

window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (screen === 'runner') jump();
    else if (screen === 'gameover') restartRunner();
  }
});

// ==================== ГЛАВНЫЙ ЦИКЛ ====================
function loop() {
  frame++;
  ctx.clearRect(0, 0, W, H);

  if (screen === 'menu') { updateMenu(); drawMenu(); }
  else if (screen === 'difficulty') { drawDifficulty(); }
  else if (screen === 'runner') { updateRunner(); drawRunner(); }
  else if (screen === 'quiz') { updateQuiz(); drawQuiz(); }
  else if (screen === 'help') { drawHelp(); }
  else if (screen === 'gameover') { drawGameOver(); }

  requestAnimationFrame(loop);
}

loop();
</script>
