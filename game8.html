<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Нейрогенез — Аквариум</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;cursor:none}
canvas{display:block;position:fixed;inset:0}
#ui{position:fixed;top:0;left:0;right:0;z-index:10;
  background:rgba(0,8,20,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(64,180,255,.15);padding:10px 16px 8px}
#line-text{font:14px/1.6 Inter,sans-serif;color:#eee;min-height:22px}
#score-bar{font:10px Inter,sans-serif;color:rgba(100,200,255,.55);margin-top:3px;letter-spacing:1px}
.wd{color:rgba(255,255,255,.25);text-decoration:line-through}
.wc{color:#ffd700;font-weight:600;text-shadow:0 0 10px rgba(255,215,0,.6)}
.wp{color:rgba(255,255,255,.55)}
.wn{color:rgba(255,255,255,.32)}
#hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:10;
  background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);
  border-radius:20px;padding:7px 20px;font:11px Inter,sans-serif;
  color:rgba(255,255,255,.5);pointer-events:none;white-space:nowrap;
  transition:opacity .3s}
#win{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px}
#win.show{display:flex}
#win h2{font:300 2rem Georgia,serif;color:#ffd700;letter-spacing:.2em}
#win p{font:13px Inter,sans-serif;color:rgba(255,255,255,.5)}
#win button{padding:11px 30px;border:1px solid rgba(255,255,255,.25);background:transparent;
  color:white;font-size:12px;border-radius:4px;cursor:pointer;letter-spacing:2px;
  transition:all .3s}
#win button:hover{background:rgba(255,255,255,.08)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="line-text"></div>
  <div id="score-bar">Очки: 0 | Строка 1/1</div>
</div>
<div id="hint">Веди рыбу мышью или пальцем</div>
<div id="win">
  <h2>Завершено</h2>
  <p id="win-msg"></p>
  <button onclick="location.reload()">Играть снова</button>
</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;
const resize=()=>{W=C.width=innerWidth;H=C.height=innerHeight;};
window.addEventListener('resize',resize);resize();

// Polyfill roundRect
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.moveTo(x+r,y);this.lineTo(x+w-r,y);
    this.arcTo(x+w,y,x+w,y+r,r);this.lineTo(x+w,y+h-r);
    this.arcTo(x+w,y+h,x+w-r,y+h,r);this.lineTo(x+r,y+h);
    this.arcTo(x,y+h,x,y+h-r,r);this.lineTo(x,y+r);
    this.arcTo(x,y,x+r,y,r);this.closePath();
  };
}

// === DATA ===
const G=[null,
  {c:'#ff4444',s:'rgba(255,68,68,.2)',l:'ИСЭ'},
  {c:'#ffcc00',s:'rgba(255,204,0,.2)',l:'АЙПТ'},
  {c:'#44dd44',s:'rgba(68,221,68,.2)',l:'БЗМЮ'},
  {c:'#00cccc',s:'rgba(0,204,204,.2)',l:'ВКФЯ'},
  {c:'#4488ff',s:'rgba(68,136,255,.2)',l:'ДЛХЫ'},
  {c:'#88dd88',s:'rgba(136,221,136,.2)',l:'ЕОЦЬ'},
  {c:'#aaaaaa',s:'rgba(170,170,170,.2)',l:'ЁНЪ'},
  {c:'#ff66aa',s:'rgba(255,102,170,.2)',l:'ГУЧЩ'},
  {c:'#9944ff',s:'rgba(153,68,255,.2)',l:'ЖРШ'}
];
const L2G={};
G.slice(1).forEach((g,i)=>[...g.l].forEach(l=>L2G[l]=i+1));
const GR=n=>12+n*4; // radius: 16..48

// === SONG ===
const SONG_RAW=[
'Космический','Вселенский','Йо Галактики','В сердце','Абсолют света',
'Плазма и поле','Вечное','Живая вода',
'Правитель','Пьедестала','Бездействия','Истина пустота','Йо Ха Ва Дхо',
'Отсутствие я','Осознания','Всемирно','Совместный','Сладчайший','Пресладкий',
'Цельный','Кровный','Благосвет','Кормящий','Манговый','Мяконький',
'Промысел','Ягодный','Новейший','О Престол','Знание Сок',
'Север Юг','Запад восток','Чистый дух','Магнетизма','И Квантовый',
'Тор воды','Торнадо','Тот Вибрации','Океан сути',
'Чистый дух','Простора','Свобода','ибо Просто Ра','тишина бытия',
'Потенциал','Всеединый','Всеоснова',
'Отсутствие я','Осознания Суть сейчас','Этот миг мига',
'Всё и ничто','Одно ума','Маха Разум','Истина пустота','Святой дух',
'Мира форм','И ничего Звука Есмь',
'Отсутствие я Осознания','Отсутствие я Осознания','Или Источник Сущего',
'Итог Покой',
'Присутствие','Безмолвие','Мера Эфира','Всё и ничто','Одно свет',
'Всеблагой','Небесный','Святой дух','Веры свет','Абсолют мысли','Инь души',
'Отсутствие я Осознания','Отсутствие я Осознания','Или Источник Сущего я'
];

function g4w(w){
  for(const c of w){const u=c.toUpperCase();if(L2G[u])return L2G[u];}
  return null;
}

const LINES=SONG_RAW.map(text=>{
  const words=text.split(/\s+/);
  let si=0;
  const meta=words.map(w=>{
    const g=g4w(w);
    return g?{w,g,si:si++}:{w,g:null,si:-1};
  });
  const seq=meta.filter(m=>m.g).map(m=>m.g);
  return seq.length?{text,meta,seq}:null;
}).filter(Boolean);

// === AUDIO ===
let AC=null;
const FREQS=[174,285,369,417,528,639,741,852,963];
function initAudio(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();}
function playTone(grp){
  if(!AC)return;
  if(AC.state==='suspended')AC.resume();
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';o.frequency.value=FREQS[grp-1];
  g.gain.setValueAtTime(.25,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.4);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.4);
}
function playErr(){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sawtooth';o.frequency.value=160;
  g.gain.setValueAtTime(.15,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.35);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.35);
}
function playWin(){
  if(!AC)return;
  [528,639,852,963].forEach((f,i)=>{
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';o.frequency.value=f;
    const t=AC.currentTime+i*.18;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+.05);
    g.gain.exponentialRampToValueAtTime(.001,t+.6);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.6);
  });
}

// === SHAPES ===
const SHP=['circle','rect','tri','dia'];
let shapes=[];

function mkShape(grp,sx,sy){
  const ls=[...G[grp].l];
  const li=Math.floor(Math.random()*ls.length);
  return{
    g:grp,r:GR(grp),letter:ls[li],shp:SHP[li%4],
    x:sx!=null?sx:80+Math.random()*(W-160),
    y:sy!=null?sy:90+Math.random()*(H-160),
    vx:(Math.random()-.5)*.8,vy:(Math.random()-.5)*.6,
    ph:Math.random()*Math.PI*2,alive:true,age:0
  };
}

function ensureShapes(){
  for(let g=1;g<=9;g++){
    const cnt=shapes.filter(s=>s.alive&&s.g===g).length;
    if(cnt<2&&shapes.filter(s=>s.alive).length<50)
      shapes.push(mkShape(g));
  }
}

// === BUBBLES ===
const bubs=Array.from({length:22},()=>({
  x:Math.random()*100,y:Math.random()*600,
  r:.8+Math.random()*2.5,sp:.25+Math.random()*.55,ph:Math.random()*Math.PI*2
}));

// === FISH ===
const FR=22;
const fish={x:300,y:300,a:0,mouth:0,held:null,flash:0};
let px=300,py=300;

// === GAME ===
let lineIdx=0,stepIdx=0,score=0,isDone=false;
let hintMsg='';

function targetGroup(){
  if(lineIdx>=LINES.length)return null;
  return LINES[lineIdx].seq[stepIdx];
}

function setHint(msg){
  hintMsg=msg;
  document.getElementById('hint').textContent=msg;
}

function updateUI(){
  if(lineIdx>=LINES.length)return;
  const line=LINES[lineIdx];
  const html=line.meta.map(({w,si})=>{
    if(si<0)return'<span class="wn">'+w+'</span>';
    if(si<stepIdx)return'<span class="wd">'+w+'</span>';
    if(si===stepIdx)return'<span class="wc">'+w+'</span>';
    return'<span class="wp">'+w+'</span>';
  }).join(' ');
  document.getElementById('line-text').innerHTML=html;
  document.getElementById('score-bar').textContent=
    'Очки: '+score+' | Строка '+(lineIdx+1)+'/'+LINES.length;
  const tg=targetGroup();
  if(tg&&!fish.held)setHint('Найди фигуру №'+tg+' — '+G[tg].l);
}

function advance(){
  const line=LINES[lineIdx];
  stepIdx++;
  if(stepIdx>=line.seq.length){
    score+=50+lineIdx*3;
    lineIdx++;stepIdx=0;
    if(lineIdx>=LINES.length){gameWin();return;}
  }
  updateUI();
}

function gameWin(){
  isDone=true;
  playWin();
  document.getElementById('win-msg').textContent='Все строки пройдены! Очки: '+score;
  document.getElementById('win').classList.add('show');
}

// === UPDATE ===
const SPIT={r:50};

function update(){
  if(isDone)return;

  // Fish → pointer
  const dx=px-fish.x,dy=py-fish.y,dist=Math.hypot(dx,dy);
  if(dist>2){
    fish.x+=dx*.09;fish.y+=dy*.09;
    fish.a=Math.atan2(dy,dx);
    fish.mouth=Math.min(fish.mouth+.07,.38);
  }else fish.mouth=Math.max(fish.mouth-.06,0);
  fish.flash=Math.max(fish.flash-.06,0);

  // Spit zone — bottom right
  SPIT.x=W-70;SPIT.y=H-90;

  ensureShapes();
  const tg=targetGroup();

  for(const s of shapes){
    if(!s.alive)continue;
    s.age++;
    s.x+=s.vx;
    s.y+=s.vy+Math.sin(Date.now()*.001+s.ph)*.22;
    if(s.x-s.r<10){s.x=s.r+10;s.vx=Math.abs(s.vx);}
    if(s.x+s.r>W-10){s.x=W-s.r-10;s.vx=-Math.abs(s.vx);}
    if(s.y-s.r<72){s.y=s.r+72;s.vy=Math.abs(s.vy);}
    if(s.y+s.r>H-10){s.y=H-s.r-10;s.vy=-Math.abs(s.vy);}
    s.vx+=(Math.random()-.5)*.04;s.vy+=(Math.random()-.5)*.035;
    s.vx=Math.max(-1.3,Math.min(1.3,s.vx));
    s.vy=Math.max(-1.2,Math.min(1.2,s.vy));

    // Eat check (mouth pos)
    const hx=fish.x+Math.cos(fish.a)*FR,hy=fish.y+Math.sin(fish.a)*FR;
    if(Math.hypot(s.x-hx,s.y-hy)<s.r+8){
      initAudio();
      if(s.g===tg){
        s.alive=false;
        score+=s.g*10;
        fish.flash=1;
        playTone(s.g);
        advance();
      }else if(!fish.held){
        s.alive=false;
        fish.held=s.g;
        playErr();
        setHint('Не та! Плыви в жёлтую зону →');
      }
    }
  }

  // Spit zone
  if(fish.held&&Math.hypot(fish.x-SPIT.x,fish.y-SPIT.y)<SPIT.r+FR){
    const ns=mkShape(fish.held,SPIT.x+(Math.random()-.5)*60,SPIT.y-50);
    ns.vx=(Math.random()-.5)*2;ns.vy=-2;
    shapes.push(ns);
    fish.held=null;
    updateUI();
  }

  shapes=shapes.filter(s=>s.alive);

  // Bubbles
  for(const b of bubs){
    b.y-=b.sp;if(b.y<-10)b.y=H+10;
    b.x+=Math.sin(Date.now()*.0008+b.ph)*.35;
    if(b.x<0)b.x=0;if(b.x>W)b.x=W;
  }
}

// === DRAW ===
function drawBg(){
  const gr=X.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,'#000d1f');gr.addColorStop(1,'#001428');
  X.fillStyle=gr;X.fillRect(0,0,W,H);

  // Light rays
  for(let i=0;i<4;i++){
    const rx=W*(.12+i*.25)+Math.sin(Date.now()*.00018+i*1.3)*20;
    X.fillStyle='rgba(80,180,255,'+((.012+Math.sin(Date.now()*.0003+i)*.006)).toFixed(4)+')';
    X.beginPath();X.moveTo(rx-15,0);X.lineTo(rx+70,H);X.lineTo(rx-70,H);X.closePath();X.fill();
  }

  // Bubbles
  X.save();
  for(const b of bubs){
    X.strokeStyle='rgba(160,230,255,.2)';X.lineWidth=.8;
    X.beginPath();X.arc(b.x,b.y,b.r,0,Math.PI*2);X.stroke();
  }
  X.restore();
}

function drawSpitZone(){
  const {x,y,r}=SPIT,t=Date.now()*.003,p=.5+Math.sin(t)*.5;
  X.save();X.translate(x,y);
  X.strokeStyle='rgba(255,200,80,'+((.28+p*.2)).toFixed(2)+')';
  X.lineWidth=2;X.setLineDash([5,5]);
  X.beginPath();X.arc(0,0,r,0,Math.PI*2);X.stroke();X.setLineDash([]);
  X.fillStyle='rgba(255,200,80,'+((.04+p*.04)).toFixed(3)+')';
  X.beginPath();X.arc(0,0,r,0,Math.PI*2);X.fill();
  X.fillStyle='rgba(255,210,80,.6)';X.font='9px Inter,sans-serif';
  X.textAlign='center';X.textBaseline='middle';X.fillText('выплюнь',0,0);X.restore();
}

function drawShape(s,hl){
  X.save();X.translate(s.x,s.y);
  const g=G[s.g],r=s.r;
  if(hl){X.shadowColor=g.c;X.shadowBlur=14+Math.sin(Date.now()*.006)*6;}
  X.fillStyle=g.s;X.strokeStyle=g.c;X.lineWidth=2;
  X.beginPath();
  if(s.shp==='circle'){X.arc(0,0,r,0,Math.PI*2);}
  else if(s.shp==='rect'){X.roundRect(-r,-r,r*2,r*2,3);}
  else if(s.shp==='tri'){X.moveTo(0,-r);X.lineTo(r*.87,r*.5);X.lineTo(-r*.87,r*.5);X.closePath();}
  else{X.moveTo(0,-r);X.lineTo(r,0);X.lineTo(0,r);X.lineTo(-r,0);X.closePath();}
  X.fill();X.stroke();
  X.shadowBlur=0;
  // Number
  X.fillStyle='rgba(255,255,255,.9)';
  X.font='bold '+(r*.72)+'px Inter,sans-serif';
  X.textAlign='center';X.textBaseline='middle';X.fillText(s.g,0,-1);
  // Letter
  X.fillStyle='rgba(255,255,255,.55)';
  X.font=(r*.42)+'px Inter,sans-serif';X.fillText(s.letter,0,r*.52);
  X.restore();
}

function drawFish(){
  X.save();X.translate(fish.x,fish.y);X.rotate(fish.a);
  const r=FR;
  if(fish.flash>0){X.shadowColor='rgba(100,255,160,.5)';X.shadowBlur=24*fish.flash;}
  // Body
  const held=fish.held;
  X.fillStyle=held?'#ffdd55':'#5bc9f6';
  X.strokeStyle=held?'#e67e00':'#0299d0';
  X.lineWidth=1.5;
  X.beginPath();X.ellipse(0,0,r,r*.55,0,0,Math.PI*2);X.fill();X.stroke();
  // Tail
  X.beginPath();X.moveTo(-r*.7,0);X.lineTo(-r*1.45,-r*.65);X.lineTo(-r*1.45,r*.65);X.closePath();X.fill();X.stroke();
  // Top fin
  X.beginPath();X.moveTo(r*.05,-r*.4);X.lineTo(r*.25,-r*.88);X.lineTo(r*.55,-r*.42);X.closePath();X.fill();
  // Eye
  X.shadowBlur=0;
  X.fillStyle='white';X.beginPath();X.arc(r*.42,-r*.16,r*.17,0,Math.PI*2);X.fill();
  X.fillStyle='#111';X.beginPath();X.arc(r*.47,-r*.15,r*.085,0,Math.PI*2);X.fill();
  // Mouth
  X.strokeStyle='rgba(0,0,0,.45)';X.lineWidth=1.2;
  const mo=fish.mouth;
  X.beginPath();X.moveTo(r*.82,-mo*r*.44);X.lineTo(r*.97,0);X.lineTo(r*.82,mo*r*.44);X.stroke();
  // Held indicator dot
  if(held){
    X.fillStyle=G[held].c;X.beginPath();X.arc(0,0,5,0,Math.PI*2);X.fill();
    X.fillStyle='white';X.font='bold 6px Inter';X.textAlign='center';X.textBaseline='middle';X.fillText(held,0,0);
  }
  X.restore();
}

function drawArrow(tg){
  const ts=shapes.filter(s=>s.alive&&s.g===tg);
  if(!ts.length)return;
  const near=ts.reduce((a,b)=>Math.hypot(a.x-fish.x,a.y-fish.y)<Math.hypot(b.x-fish.x,b.y-fish.y)?a:b);
  const d=Math.hypot(near.x-fish.x,near.y-fish.y);
  if(d<100)return;
  const ang=Math.atan2(near.y-fish.y,near.x-fish.x);
  const sx=fish.x+Math.cos(ang)*38,sy=fish.y+Math.sin(ang)*38;
  const ex=fish.x+Math.cos(ang)*62,ey=fish.y+Math.sin(ang)*62;
  X.save();
  X.strokeStyle='rgba(255,255,80,.32)';X.lineWidth=1.5;X.setLineDash([4,7]);
  X.beginPath();X.moveTo(sx,sy);X.lineTo(ex,ey);X.stroke();X.setLineDash([]);
  X.translate(ex,ey);X.rotate(ang);
  X.fillStyle='rgba(255,255,80,.42)';X.beginPath();
  X.moveTo(0,0);X.lineTo(-9,-4);X.lineTo(-9,4);X.closePath();X.fill();
  X.restore();
}

function draw(){
  drawBg();
  drawSpitZone();
  const tg=targetGroup();
  shapes.filter(s=>s.alive).forEach(s=>drawShape(s,s.g===tg));
  if(tg&&!fish.held)drawArrow(tg);
  drawFish();
}

// === INPUT ===
document.addEventListener('mousemove',e=>{px=e.clientX;py=e.clientY;});
document.addEventListener('touchstart',e=>{initAudio();px=e.touches[0].clientX;py=e.touches[0].clientY;},{passive:false});
document.addEventListener('touchmove',e=>{e.preventDefault();px=e.touches[0].clientX;py=e.touches[0].clientY;},{passive:false});
document.addEventListener('click',initAudio);

// === LOOP ===
function loop(){update();draw();requestAnimationFrame(loop);}

fish.x=innerWidth*.5;fish.y=innerHeight*.5;
px=fish.x;py=fish.y;
ensureShapes();
updateUI();
requestAnimationFrame(loop);
</script>
</body>
</html>
