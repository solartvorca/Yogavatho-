<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Нейрогенез — Аквариум</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;cursor:none;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
canvas{display:block;position:fixed;inset:0}
#ui{position:fixed;top:0;left:0;right:0;z-index:10;
  background:linear-gradient(180deg,rgba(0,12,30,.94) 0%,rgba(0,8,20,.8) 100%);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(64,180,255,.12);padding:12px 18px 10px}
#line-text{font:15px/1.7 system-ui,sans-serif;color:#eee;min-height:24px;letter-spacing:.02em}
#word-indicator{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:10;
  background:rgba(0,8,20,.7);border:1px solid rgba(255,215,0,.2);
  border-radius:20px;padding:6px 20px;font:13px system-ui,sans-serif;
  color:#ffd700;pointer-events:none;transition:opacity .5s}
#score-bar{font:11px system-ui,sans-serif;color:rgba(100,200,255,.5);margin-top:4px;letter-spacing:1.5px}
.wd{color:rgba(255,255,255,.18);text-decoration:line-through}
.wc{color:#ffd700;font-weight:700;text-shadow:0 0 14px rgba(255,215,0,.7),0 0 28px rgba(255,215,0,.3)}
.wp{color:rgba(255,255,255,.45)}
.wn{color:rgba(255,255,255,.22)}
#hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:10;
  background:rgba(0,8,20,.7);border:1px solid rgba(100,200,255,.15);
  border-radius:24px;padding:8px 24px;font:12px system-ui,sans-serif;
  color:rgba(160,220,255,.7);pointer-events:none;white-space:nowrap;
  transition:opacity .4s,transform .4s;box-shadow:0 4px 20px rgba(0,0,0,.3)}
#target-pill{position:fixed;top:72px;right:16px;z-index:10;
  background:rgba(0,8,20,.65);border:1px solid rgba(255,255,255,.08);
  border-radius:16px;padding:8px 16px;font:12px system-ui,sans-serif;
  color:rgba(200,230,255,.6);display:flex;align-items:center;gap:8px}
#target-pill .dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 8px currentColor}
#win{position:fixed;inset:0;z-index:50;background:rgba(0,2,10,.92);
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:24px}
#win.show{display:flex}
#win h2{font:300 2.2rem Georgia,serif;color:#ffd700;letter-spacing:.25em;text-shadow:0 0 40px rgba(255,215,0,.4)}
#win p{font:14px system-ui,sans-serif;color:rgba(255,255,255,.45)}
#win button{padding:12px 36px;border:1px solid rgba(255,255,255,.2);background:transparent;
  color:white;font-size:13px;border-radius:6px;cursor:pointer;letter-spacing:2.5px;
  transition:all .3s;font-family:system-ui,sans-serif}
#win button:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.35)}
#bite-hint{position:fixed;bottom:50%;left:50%;transform:translate(-50%,50%);z-index:5;
  font:13px system-ui,sans-serif;color:rgba(255,255,255,.35);pointer-events:none;
  opacity:0;transition:opacity .5s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="line-text"></div>
  <div id="score-bar">Очки: 0 | Строка 1/1</div>
</div>
<div id="word-indicator"></div>
<div id="target-pill" style="display:none">
  <span>Цель:</span><span class="dot" id="target-dot"></span><span id="target-info"></span>
</div>
<div id="hint">Веди рыбу мышью. Кликни, чтобы съесть фигуру</div>
<div id="bite-hint">Кликни, чтобы укусить!</div>
<div id="win">
  <h2>Завершено</h2>
  <p id="win-msg"></p>
  <button onclick="location.reload()">Играть снова</button>
</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;
const resize=()=>{W=C.width=innerWidth;H=C.height=innerHeight;};
window.addEventListener('resize',resize);resize();

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.moveTo(x+r,y);this.lineTo(x+w-r,y);
    this.arcTo(x+w,y,x+w,y+r,r);this.lineTo(x+w,y+h-r);
    this.arcTo(x+w,y+h,x+w-r,y+h,r);this.lineTo(x+r,y+h);
    this.arcTo(x,y+h,x,y+h-r,r);this.lineTo(x,y+r);
    this.arcTo(x,y,x+r,y,r);this.closePath();
  };
}

// === DATA ===
const G=[null,
  {c:'#ff4444',s:'rgba(255,68,68,.18)',glow:'rgba(255,68,68,.5)',l:'ИСЭ'},
  {c:'#ffcc00',s:'rgba(255,204,0,.18)',glow:'rgba(255,204,0,.5)',l:'АЙПТ'},
  {c:'#44dd44',s:'rgba(68,221,68,.18)',glow:'rgba(68,221,68,.5)',l:'БЗМЮ'},
  {c:'#00cccc',s:'rgba(0,204,204,.18)',glow:'rgba(0,204,204,.5)',l:'ВКФЯ'},
  {c:'#4488ff',s:'rgba(68,136,255,.18)',glow:'rgba(68,136,255,.5)',l:'ДЛХЫ'},
  {c:'#88dd88',s:'rgba(136,221,136,.18)',glow:'rgba(136,221,136,.5)',l:'ЕОЦЬ'},
  {c:'#aaaaaa',s:'rgba(170,170,170,.18)',glow:'rgba(170,170,170,.5)',l:'ЁНЪ'},
  {c:'#ff66aa',s:'rgba(255,102,170,.18)',glow:'rgba(255,102,170,.5)',l:'ГУЧЩ'},
  {c:'#9944ff',s:'rgba(153,68,255,.18)',glow:'rgba(153,68,255,.5)',l:'ЖРШ'}
];
const L2G={};
G.slice(1).forEach((g,i)=>[...g.l].forEach(l=>L2G[l]=i+1));
const GR=n=>18+n*5;

// === SONG ===
const SONG_RAW=[
'Космический','Вселенский','Йо Галактики','В сердце','Абсолют света',
'Плазма и поле','Вечное','Живая вода',
'Правитель','Пьедестала','Бездействия','Истина пустота','Йо Ха Ва Дхо',
'Отсутствие я','Осознания','Всемирно','Совместный','Сладчайший','Пресладкий',
'Цельный','Кровный','Благосвет','Кормящий','Манговый','Мяконький',
'Промысел','Ягодный','Новейший','О Престол','Знание Сок',
'Север Юг','Запад восток','Чистый дух','Магнетизма','И Квантовый',
'Тор воды','Торнадо','Тот Вибрации','Океан сути',
'Чистый дух','Простора','Свобода','ибо Просто Ра','тишина бытия',
'Потенциал','Всеединый','Всеоснова',
'Отсутствие я','Осознания Суть сейчас','Этот миг мига',
'Всё и ничто','Одно ума','Маха Разум','Истина пустота','Святой дух',
'Мира форм','И ничего Звука Есмь',
'Отсутствие я Осознания','Отсутствие я Осознания','Или Источник Сущего',
'Итог Покой',
'Присутствие','Безмолвие','Мера Эфира','Всё и ничто','Одно свет',
'Всеблагой','Небесный','Святой дух','Веры свет','Абсолют мысли','Инь души',
'Отсутствие я Осознания','Отсутствие я Осознания','Или Источник Сущего я'
];

function parseLines(){
  return SONG_RAW.map(text=>{
    const words=text.split(/\s+/);
    const wordData=[];
    words.forEach(w=>{
      const letters=[];
      const seenGroups=new Set();
      const uniqueGroups=[];
      for(let i=0;i<w.length;i++){
        const c=w[i];
        const u=c.toUpperCase();
        const grp=L2G[u];
        letters.push({char:c,upper:u,group:grp,index:i});
        if(grp && !seenGroups.has(grp)){
          seenGroups.add(grp);
          uniqueGroups.push({group:grp,letter:u,firstIndex:i});
        }
      }
      if(uniqueGroups.length>0){
        wordData.push({word:w,letters,uniqueGroups});
      }
    });
    return wordData.length>0?{text,words:wordData}:null;
  }).filter(Boolean);
}

const LINES=parseLines();

// === AUDIO ===
let AC=null;
const FREQS=[174,285,369,417,528,639,741,852,963];
function initAudio(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();}
function playTone(grp){
  if(!AC)return;
  if(AC.state==='suspended')AC.resume();
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';o.frequency.value=FREQS[grp-1];
  g.gain.setValueAtTime(.22,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.5);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.5);
}
function playErr(){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sawtooth';o.frequency.value=140;
  g.gain.setValueAtTime(.1,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.25);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.25);
}
function playBite(){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='triangle';o.frequency.value=320;
  g.gain.setValueAtTime(.12,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.12);
  o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.12);
}
function playWordComplete(){
  if(!AC)return;
  [396,528,660].forEach((f,i)=>{
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';o.frequency.value=f;
    const t=AC.currentTime+i*.12;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.15,t+.04);
    g.gain.exponentialRampToValueAtTime(.001,t+.4);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.4);
  });
}
function playWin(){
  if(!AC)return;
  [528,639,852,963].forEach((f,i)=>{
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';o.frequency.value=f;
    const t=AC.currentTime+i*.18;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.05);
    g.gain.exponentialRampToValueAtTime(.001,t+.7);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.7);
  });
}

// === SHAPES ===
const SHP=['circle','rect','tri','dia'];
let shapes=[];

function mkShape(grp,letter,sx,sy){
  const ls=[...G[grp].l];
  const li=ls.indexOf(letter);
  const shapeIdx=li>=0?li:Math.floor(Math.random()*ls.length);
  return{
    g:grp,r:GR(grp),letter:letter,shp:SHP[shapeIdx%4],
    x:sx!=null?sx:80+Math.random()*(W-160),
    y:sy!=null?sy:100+Math.random()*(H-180),
    vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.4,
    ph:Math.random()*Math.PI*2,alive:true,age:0,
    pulse:Math.random()*Math.PI*2,scale:0,
    spawnTime:Date.now()
  };
}

function spawnWordShapes(wordData){
  shapes=[];
  const groups=wordData.uniqueGroups;
  groups.forEach((g,i)=>{
    const angle=(Math.PI*2*i)/groups.length+Math.random()*.3;
    const dist=100+Math.random()*100;
    const sx=W/2+Math.cos(angle)*dist;
    const sy=H/2+Math.sin(angle)*dist;
    shapes.push(mkShape(g.group,g.letter,sx,sy));
  });
}

// === PARTICLES ===
let particles=[];
function spawnParticles(x,y,color,count=8){
  for(let i=0;i<count;i++){
    const ang=Math.random()*Math.PI*2;
    const sp=.5+Math.random()*2.5;
    particles.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:1,color,r:1+Math.random()*2.5});
  }
}
function updateParticles(){
  for(const p of particles){
    p.x+=p.vx;p.y+=p.vy;
    p.vx*=.96;p.vy*=.96;
    p.life-=.025;
  }
  particles=particles.filter(p=>p.life>0);
}
function drawParticles(){
  for(const p of particles){
    X.globalAlpha=p.life*.7;
    X.fillStyle=p.color;
    X.beginPath();X.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);X.fill();
  }
  X.globalAlpha=1;
}

// === BUBBLES ===
const bubs=Array.from({length:30},()=>({
  x:Math.random()*100,y:Math.random()*600,
  r:.6+Math.random()*3,sp:.2+Math.random()*.7,ph:Math.random()*Math.PI*2,
  wobble:Math.random()*Math.PI*2
}));

// === DUST ===
const dust=Array.from({length:50},()=>({
  x:Math.random()*innerWidth,y:Math.random()*innerHeight,
  r:.3+Math.random()*1.2,sp:.05+Math.random()*.15,ph:Math.random()*Math.PI*2
}));

// === FISH ===
const FR=24;
const fish={x:300,y:300,a:0,mouth:0,flash:0,velX:0,velY:0,tailWag:0,finWag:0};
let px=300,py=300;

// === GAME STATE ===
let lineIdx=0,wordIdx=0,stepIdx=0,score=0,isDone=false;
let biteCooldown=0;
let nearShape=null;
let transitionTimer=0;
let isTransitioning=false;

function currentWord(){
  if(lineIdx>=LINES.length)return null;
  const line=LINES[lineIdx];
  if(wordIdx>=line.words.length)return null;
  return line.words[wordIdx];
}

function targetGroup(){
  const word=currentWord();
  if(!word)return null;
  if(stepIdx>=word.uniqueGroups.length)return null;
  return word.uniqueGroups[stepIdx].group;
}

function targetLetter(){
  const word=currentWord();
  if(!word)return null;
  if(stepIdx>=word.uniqueGroups.length)return null;
  return word.uniqueGroups[stepIdx].letter;
}

function collectedGroups(){
  const word=currentWord();
  if(!word)return new Set();
  const set=new Set();
  for(let i=0;i<stepIdx;i++){
    set.add(word.uniqueGroups[i].group);
  }
  return set;
}

function updateUI(){
  if(lineIdx>=LINES.length)return;
  const line=LINES[lineIdx];

  let html='';
  for(let wi=0;wi<line.words.length;wi++){
    const w=line.words[wi];
    if(wi>0)html+=' ';
    if(wi<wordIdx){
      html+='<span class="wd">'+w.word+'</span>';
    }else if(wi===wordIdx){
      const collected=collectedGroups();
      const currentGrp=targetGroup();
      let wordHtml='';
      for(const letter of w.letters){
        if(letter.group){
          if(collected.has(letter.group)){
            wordHtml+='<span class="wd">'+letter.char+'</span>';
          }else if(letter.group===currentGrp){
            wordHtml+='<span class="wc">'+letter.char+'</span>';
          }else{
            wordHtml+='<span class="wp">'+letter.char+'</span>';
          }
        }else{
          wordHtml+=letter.char;
        }
      }
      html+='<span style="border-bottom:1px solid rgba(255,215,0,.3)">'+wordHtml+'</span>';
    }else{
      html+='<span class="wn">'+w.word+'</span>';
    }
  }
  document.getElementById('line-text').innerHTML=html;
  document.getElementById('score-bar').textContent=
    'Очки: '+score+' | Строка '+(lineIdx+1)+'/'+LINES.length+' | Слово '+(wordIdx+1)+'/'+line.words.length;

  const wordInd=document.getElementById('word-indicator');
  const word=currentWord();
  if(word){
    wordInd.textContent='«'+word.word+'»';
    wordInd.style.opacity='1';
  }else{
    wordInd.style.opacity='0';
  }

  const tg=targetGroup();
  const pill=document.getElementById('target-pill');
  if(tg){
    pill.style.display='flex';
    document.getElementById('target-dot').style.background=G[tg].c;
    document.getElementById('target-dot').style.boxShadow='0 0 10px '+G[tg].c;
    const tl=targetLetter();
    document.getElementById('target-info').textContent='Буква '+tl+' (гр.'+tg+')';
    document.getElementById('target-info').style.color=G[tg].c;
  }else{
    pill.style.display='none';
  }
}

function advance(){
  const word=currentWord();
  if(!word)return;

  stepIdx++;
  score+=15;

  if(stepIdx>=word.uniqueGroups.length){
    score+=50+wordIdx*5;
    playWordComplete();
    wordIdx++;
    stepIdx=0;

    const line=LINES[lineIdx];
    if(wordIdx>=line.words.length){
      lineIdx++;wordIdx=0;
      if(lineIdx>=LINES.length){gameWin();return;}
    }

    isTransitioning=true;
    transitionTimer=40;

    const nextWord=currentWord();
    if(nextWord){
      setTimeout(()=>{
        spawnWordShapes(nextWord);
        isTransitioning=false;
      },600);
    }
  }
  updateUI();
}

function gameWin(){
  isDone=true;
  playWin();
  document.getElementById('win-msg').textContent='Все строки пройдены! Очки: '+score;
  document.getElementById('win').classList.add('show');
}

// === UPDATE ===
const BITE_R=55;

function update(){
  if(isDone)return;
  const now=Date.now();

  if(isTransitioning){
    transitionTimer--;
    if(transitionTimer<=0)isTransitioning=false;
    for(const s of shapes){
      s.scale=Math.max(0,s.scale-.04);
    }
    shapes=shapes.filter(s=>s.scale>0.01);

    const dx=px-fish.x,dy=py-fish.y,dist=Math.hypot(dx,dy);
    if(dist>3){
      const spd=Math.min(dist*.07,4.5);
      fish.velX+=((dx/dist)*spd-fish.velX)*.15;
      fish.velY+=((dy/dist)*spd-fish.velY)*.15;
      fish.x+=fish.velX;
      fish.y+=fish.velY;
      fish.a=Math.atan2(dy,dx);
      fish.tailWag+=.18;fish.finWag+=.22;
    }
    fish.x=Math.max(FR,Math.min(W-FR,fish.x));
    fish.y=Math.max(FR+60,Math.min(H-FR,fish.y));

    updateParticles();
    for(const b of bubs){b.y-=b.sp;if(b.y<-15)b.y=H+15;}
    for(const d of dust){d.y-=d.sp;if(d.y<-5){d.y=H+5;d.x=Math.random()*W;}}
    return;
  }

  const dx=px-fish.x,dy=py-fish.y,dist=Math.hypot(dx,dy);
  if(dist>3){
    const spd=Math.min(dist*.07,4.5);
    fish.velX+=((dx/dist)*spd-fish.velX)*.15;
    fish.velY+=((dy/dist)*spd-fish.velY)*.15;
    fish.x+=fish.velX;
    fish.y+=fish.velY;
    fish.a=Math.atan2(dy,dx);
    fish.mouth=Math.min(fish.mouth+.06,.35);
    fish.tailWag+=.18;fish.finWag+=.22;
  }else{
    fish.velX*=.9;fish.velY*=.9;
    fish.mouth=Math.max(fish.mouth-.05,0);
    fish.tailWag+=.08;fish.finWag+=.1;
  }
  fish.flash=Math.max(fish.flash-.05,0);
  if(biteCooldown>0)biteCooldown--;

  fish.x=Math.max(FR,Math.min(W-FR,fish.x));
  fish.y=Math.max(FR+60,Math.min(H-FR,fish.y));

  const tg=targetGroup();
  nearShape=null;
  let nearestDist=Infinity;

  for(const s of shapes){
    if(!s.alive)continue;
    s.age++;
    s.pulse+=.03;
    if(s.scale<1)s.scale=Math.min(1,s.scale+.04);

    s.x+=s.vx;
    s.y+=s.vy+Math.sin(now*.0008+s.ph)*.18;

    if(s.x-s.r<15){s.x=s.r+15;s.vx=Math.abs(s.vx)*.9+.1;}
    if(s.x+s.r>W-15){s.x=W-s.r-15;s.vx=-Math.abs(s.vx)*.9-.1;}
    if(s.y-s.r<78){s.y=s.r+78;s.vy=Math.abs(s.vy)*.9+.1;}
    if(s.y+s.r>H-15){s.y=H-s.r-15;s.vy=-Math.abs(s.vy)*.9-.1;}

    s.vx+=(Math.random()-.5)*.03;
    s.vy+=(Math.random()-.5)*.025;
    s.vx=Math.max(-1.1,Math.min(1.1,s.vx));
    s.vy=Math.max(-1,Math.min(1,s.vy));

    // Gentle push — no auto-eat on collision
    const hx=fish.x+Math.cos(fish.a)*FR*.7;
    const hy=fish.y+Math.sin(fish.a)*FR*.7;
    const fd=Math.hypot(s.x-hx,s.y-hy);
    if(fd<s.r+FR*.55){
      const pushAng=Math.atan2(s.y-fish.y,s.x-fish.x);
      s.vx+=Math.cos(pushAng)*.6;
      s.vy+=Math.sin(pushAng)*.6;
      s.x+=Math.cos(pushAng)*2;
      s.y+=Math.sin(pushAng)*2;
    }

    const bd=Math.hypot(s.x-fish.x,s.y-fish.y);
    if(bd<nearestDist&&bd<BITE_R+40){
      nearestDist=bd;
      nearShape=s;
    }
  }

  const biteHint=document.getElementById('bite-hint');
  if(nearShape&&tg&&nearShape.g===tg&&biteCooldown===0&&!isTransitioning){
    biteHint.style.opacity='1';
  }else{
    biteHint.style.opacity='0';
  }

  updateParticles();

  for(const b of bubs){
    b.y-=b.sp;if(b.y<-15)b.y=H+15;
    b.x+=Math.sin(now*.0007+b.ph)*.4+Math.sin(now*.001+b.wobble)*.2;
    if(b.x<0)b.x=0;if(b.x>W)b.x=W;
  }
  for(const d of dust){
    d.y-=d.sp;d.x+=Math.sin(now*.0005+d.ph)*.15;
    if(d.y<-5){d.y=H+5;d.x=Math.random()*W;}
    if(d.x<0)d.x=W;if(d.x>W)d.x=0;
  }
}

// === BITE ACTION (only on click) ===
function bite(){
  if(isDone||biteCooldown>0||isTransitioning)return;
  initAudio();
  biteCooldown=8;

  const tg=targetGroup();
  if(!tg)return;

  const biteX=fish.x+Math.cos(fish.a)*FR;
  const biteY=fish.y+Math.sin(fish.a)*FR;

  let ate=false;
  for(const s of shapes){
    if(!s.alive)continue;
    const d=Math.hypot(s.x-biteX,s.y-biteY);
    if(d<s.r+20){
      if(s.g===tg){
        s.alive=false;
        score+=s.g*10+25;
        fish.flash=1;
        playTone(s.g);
        spawnParticles(s.x,s.y,G[s.g].c,14);
        advance();
        ate=true;
      }else{
        // Wrong shape — push it away, no penalty
        const pushAng=Math.atan2(s.y-biteY,s.x-biteX);
        s.vx+=Math.cos(pushAng)*3;
        s.vy+=Math.sin(pushAng)*3;
        s.x+=Math.cos(pushAng)*20;
        s.y+=Math.sin(pushAng)*20;
        spawnParticles(s.x,s.y,'rgba(255,255,255,.3)',3);
      }
    }
  }

  if(!ate)playBite();
  fish.mouth=.5;
}

// === DRAW ===
function drawBg(){
  const gr=X.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,'#000814');gr.addColorStop(.4,'#001122');gr.addColorStop(1,'#001a2e');
  X.fillStyle=gr;X.fillRect(0,0,W,H);

  for(let i=0;i<5;i++){
    const rx=W*(.08+i*.22)+Math.sin(Date.now()*.00015+i*1.7)*30;
    const alpha=.008+Math.sin(Date.now()*.00025+i*.8)*.005;
    X.fillStyle='rgba(100,200,255,'+alpha.toFixed(4)+')';
    X.beginPath();X.moveTo(rx-20,0);X.lineTo(rx+90,H);X.lineTo(rx-90,H);X.closePath();X.fill();
  }

  X.save();
  for(const d of dust){
    X.fillStyle='rgba(180,220,255,'+(d.sp*.15).toFixed(3)+')';
    X.beginPath();X.arc(d.x,d.y,d.r,0,Math.PI*2);X.fill();
  }
  X.restore();

  X.save();
  for(const b of bubs){
    const alpha=.08+Math.sin(Date.now()*.001+b.ph)*.04;
    X.strokeStyle='rgba(140,210,255,'+alpha.toFixed(3)+')';
    X.lineWidth=.7;
    X.beginPath();X.arc(b.x,b.y,b.r,0,Math.PI*2);X.stroke();
    X.fillStyle='rgba(200,240,255,'+(alpha*.4).toFixed(3)+')';
    X.beginPath();X.arc(b.x-b.r*.3,b.y-b.r*.3,b.r*.25,0,Math.PI*2);X.fill();
  }
  X.restore();
}

function drawShape(s,isTarget){
  X.save();X.translate(s.x,s.y);
  X.scale(s.scale,s.scale);
  const g=G[s.g],r=s.r;

  if(isTarget){
    const pulse=1+Math.sin(Date.now()*.004+s.pulse)*.15;
    X.shadowColor=g.glow;
    X.shadowBlur=22*pulse;
  }else{
    X.shadowColor=g.c;
    X.shadowBlur=6;
  }

  X.fillStyle=g.s;
  X.strokeStyle=g.c;
  X.lineWidth=2.2;
  X.beginPath();
  if(s.shp==='circle'){X.arc(0,0,r,0,Math.PI*2);}
  else if(s.shp==='rect'){X.roundRect(-r,-r,r*2,r*2,5);}
  else if(s.shp==='tri'){X.moveTo(0,-r);X.lineTo(r*.87,r*.5);X.lineTo(-r*.87,r*.5);X.closePath();}
  else{X.moveTo(0,-r);X.lineTo(r,0);X.lineTo(0,r);X.lineTo(-r,0);X.closePath();}
  X.fill();X.stroke();

  // Gloss
  X.shadowBlur=0;
  X.fillStyle='rgba(255,255,255,.07)';
  X.beginPath();
  if(s.shp==='circle'){X.arc(-r*.25,-r*.25,r*.5,0,Math.PI*2);}
  else{X.arc(-r*.2,-r*.3,r*.45,0,Math.PI*2);}
  X.fill();

  // Letter big
  X.fillStyle=isTarget?'#fff':'rgba(255,255,255,.88)';
  X.font='bold '+(r*.9)+'px system-ui,-apple-system,sans-serif';
  X.textAlign='center';X.textBaseline='middle';
  X.shadowColor='rgba(0,0,0,.4)';X.shadowBlur=3;
  X.fillText(s.letter,0,-1);
  X.shadowBlur=0;

  // Group number small
  X.fillStyle='rgba(255,255,255,.33)';
  X.font=(r*.35)+'px system-ui,sans-serif';
  X.fillText(s.g,0,r*.6);

  X.restore();
}

function drawFish(){
  X.save();X.translate(fish.x,fish.y);X.rotate(fish.a);
  const r=FR;

  if(fish.flash>0){
    X.shadowColor='rgba(100,255,180,.6)';
    X.shadowBlur=30*fish.flash;
  }

  const bgr=X.createRadialGradient(-r*.2,0,0,r*.3,0,r);
  bgr.addColorStop(0,'#7ddfff');bgr.addColorStop(.6,'#3bb8e8');bgr.addColorStop(1,'#1a8ab8');
  X.fillStyle=bgr;
  X.strokeStyle='rgba(20,140,190,.6)';
  X.lineWidth=1.5;
  X.beginPath();X.ellipse(0,0,r,r*.52,0,0,Math.PI*2);X.fill();X.stroke();

  X.fillStyle='rgba(255,255,255,.11)';
  X.beginPath();X.ellipse(0,r*.15,r*.7,r*.24,0,0,Math.PI*2);X.fill();

  const tailWag=Math.sin(fish.tailWag)*.15;
  X.save();X.translate(-r*.75,0);X.rotate(tailWag);
  X.fillStyle='#2a9ec8';X.strokeStyle='rgba(20,140,190,.5)';
  X.beginPath();
  X.moveTo(0,0);
  X.quadraticCurveTo(-r*.5,-r*.55,-r*1.3,-r*.7);
  X.lineTo(-r*1.3,r*.7);
  X.quadraticCurveTo(-r*.5,r*.55,0,0);
  X.fill();X.stroke();
  X.restore();

  const finWag=Math.sin(fish.finWag)*.08;
  X.save();X.translate(r*.1,-r*.42);X.rotate(finWag);
  X.fillStyle='rgba(60,180,220,.7)';X.strokeStyle='rgba(20,140,190,.4)';
  X.beginPath();
  X.moveTo(0,0);X.quadraticCurveTo(r*.3,-r*.55,r*.7,-r*.2);X.quadraticCurveTo(r*.4,-r*.05,0,0);
  X.fill();X.stroke();
  X.restore();

  X.save();X.translate(r*.15,r*.35);X.rotate(.3+Math.sin(fish.finWag+1)*.1);
  X.fillStyle='rgba(60,180,220,.6)';
  X.beginPath();
  X.moveTo(0,0);X.quadraticCurveTo(r*.4,r*.35,r*.7,r*.1);X.quadraticCurveTo(r*.3,0,0,0);
  X.fill();X.restore();

  X.shadowBlur=0;
  X.fillStyle='white';X.beginPath();X.arc(r*.45,-r*.14,r*.16,0,Math.PI*2);X.fill();
  X.fillStyle='#0a2a3a';X.beginPath();X.arc(r*.5,-r*.13,r*.09,0,Math.PI*2);X.fill();
  X.fillStyle='rgba(255,255,255,.7)';X.beginPath();X.arc(r*.53,-r*.16,r*.04,0,Math.PI*2);X.fill();

  X.strokeStyle='rgba(10,50,70,.5)';X.lineWidth=1.3;
  const mo=fish.mouth;
  X.beginPath();
  X.moveTo(r*.88,-mo*r*.42);X.quadraticCurveTo(r*1.05,0,r*.88,mo*r*.42);X.stroke();

  X.restore();
}

function drawArrow(tg){
  const ts=shapes.filter(s=>s.alive&&s.g===tg);
  if(!ts.length)return;
  const near=ts.reduce((a,b)=>Math.hypot(a.x-fish.x,a.y-fish.y)<Math.hypot(b.x-fish.x,b.y-fish.y)?a:b);
  const d=Math.hypot(near.x-fish.x,near.y-fish.y);
  if(d<90)return;
  const ang=Math.atan2(near.y-fish.y,near.x-fish.x);
  const sx=fish.x+Math.cos(ang)*42,sy=fish.y+Math.sin(ang)*42;
  const ex=fish.x+Math.cos(ang)*72,ey=fish.y+Math.sin(ang)*72;
  X.save();
  X.strokeStyle='rgba(255,230,80,.28)';X.lineWidth=1.8;X.setLineDash([5,8]);
  X.beginPath();X.moveTo(sx,sy);X.lineTo(ex,ey);X.stroke();X.setLineDash([]);
  X.translate(ex,ey);X.rotate(ang);
  X.fillStyle='rgba(255,230,80,.38)';
  X.beginPath();X.moveTo(0,0);X.lineTo(-11,-5);X.lineTo(-11,5);X.closePath();X.fill();
  X.restore();
}

function drawBiteZone(){
  const tg=targetGroup();
  if(!tg)return;
  const biteX=fish.x+Math.cos(fish.a)*FR;
  const biteY=fish.y+Math.sin(fish.a)*FR;
  const pulse=.5+Math.sin(Date.now()*.006)*.3;
  X.save();
  X.strokeStyle='rgba(255,255,255,'+(pulse*.1).toFixed(3)+')';
  X.lineWidth=1;X.setLineDash([3,6]);
  X.beginPath();X.arc(biteX,biteY,BITE_R,0,Math.PI*2);X.stroke();
  X.setLineDash([]);
  X.restore();
}

function draw(){
  drawBg();
  drawParticles();
  const tg=targetGroup();
  shapes.filter(s=>s.alive&&s.g!==tg).forEach(s=>drawShape(s,false));
  shapes.filter(s=>s.alive&&s.g===tg).forEach(s=>drawShape(s,true));
  if(tg&&!isTransitioning){drawArrow(tg);drawBiteZone();}
  drawFish();
}

// === INPUT ===
document.addEventListener('mousemove',e=>{px=e.clientX;py=e.clientY;});
document.addEventListener('touchstart',e=>{
  initAudio();px=e.touches[0].clientX;py=e.touches[0].clientY;
},{passive:false});
document.addEventListener('touchmove',e=>{
  e.preventDefault();px=e.touches[0].clientX;py=e.touches[0].clientY;
},{passive:false});
document.addEventListener('click',()=>{initAudio();bite();});
document.addEventListener('touchend',e=>{
  if(e.changedTouches.length>0){px=e.changedTouches[0].clientX;py=e.changedTouches[0].clientY;}
  bite();
},{passive:false});

// === LOOP ===
function loop(){update();draw();requestAnimationFrame(loop);}

fish.x=innerWidth*.5;fish.y=innerHeight*.5;
px=fish.x;py=fish.y;

const firstWord=currentWord();
if(firstWord)spawnWordShapes(firstWord);
updateUI();
requestAnimationFrame(loop);
</script>
