<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a1a">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Нейро-Код: Точка Света</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#0a0a1a;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ═══════════════════════════════════════════
//  ДАННЫЕ
// ═══════════════════════════════════════════
const CODE_LETTERS = {
  1:['И','С','Э'], 2:['А','Й','П','Т'], 3:['Б','З','М','Ю'],
  4:['В','К','Ф','Я'], 5:['Д','Л','Х','Ы'], 6:['Е','О','Ц','Ь'],
  7:['Ё','Н','Ъ'], 8:['Г','У','Ч','Щ'], 9:['Ж','Р','Ш']
};
const CODE_COLOR = {
  1:'#4fc3f7',2:'#ffd700',3:'#81c784',4:'#4db6ac',
  5:'#64b5f6',6:'#a5d6a7',7:'#ce93d8',8:'#ffcc02',9:'#ff8a65'
};
const LETTER_MAP = {};
Object.entries(CODE_LETTERS).forEach(([c,ls])=>
  ls.forEach((l,i)=>{ LETTER_MAP[l]={code:+c, shape:i%4}; }));
const ALL_LETTERS = Object.keys(LETTER_MAP);

const WORLDS = [
  {name:'ПУСТЫНЯ',   sky:'#1a0800', gnd:'#6b3a0f', top:'#c4621a', acc:'#ff8c00', ptc:'#ffcc88'},
  {name:'ЛЕС',       sky:'#001408', gnd:'#1a3a0a', top:'#2d6b1a', acc:'#44ff88', ptc:'#88ffaa'},
  {name:'ПОДВОДНЫЙ', sky:'#000c1e', gnd:'#003', top:'#0044aa',    acc:'#00d4ff', ptc:'#44aaff'},
  {name:'ОБЛАКА',    sky:'#6ab0d4', gnd:'#c8e8ff', top:'#ffffff',  acc:'#ffd700', ptc:'#ffffff'},
  {name:'ПОДЗЕМЕЛЬЕ',sky:'#080008', gnd:'#1a0028', top:'#3a0050',  acc:'#8b5cf6', ptc:'#cc88ff'}
];

// ═══════════════════════════════════════════
//  CANVAS
// ═══════════════════════════════════════════
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
let W=0, H=0, GY=0;

function resize(){
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width  = W + 'px';
  cv.style.height = H + 'px';
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  GY = H * 0.76;
}
window.addEventListener('resize', resize);
resize();

// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
let screen = 'menu'; // menu | quiz-select | quiz | runner | gameover | ref
let frame  = 0;
let hiScore = +localStorage.getItem('nk_hi') || 0;

// runner
const MAX_LIVES = 5;
let score=0, lives=MAX_LIVES, worldIdx=0;
let blocks=[], particles=[], bgDots=[], specials=[], dustParts=[];
let hearts=[], heartT=0;
let spawnT=0, spawnI=80, specT=0;
let transitioning=false, transTimer=0, transName='';
let runSpeed=4;
let deathFrame=-1; // -1=alive, 0+=dying (counts up to 20, then gameover)

const SPEED_STEPS  = [0.6, 1, 1.6, 2.4, 3.5];
const SPEED_LABELS = ['0.6×', '1×', '1.6×', '2.4×', '3.5×'];
let speedIdx = 2;

// quiz
let qDiff=1, qScore=0, qStreak=0;
let qQuestion=null, qResult=null, qResultT=0;

// ═══════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════
const rnd  = n => Math.random()*n;
const rndI = n => Math.floor(Math.random()*n);
const rndL = ()=> ALL_LETTERS[rndI(ALL_LETTERS.length)];
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=rndI(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; }

function pxFont(size){ return `bold ${size}px monospace`; }

function roundRect(x,y,w,h,r){
  cx.beginPath();
  if(cx.roundRect){ cx.roundRect(x,y,w,h,r); }
  else{
    cx.moveTo(x+r,y); cx.lineTo(x+w-r,y);
    cx.arcTo(x+w,y,x+w,y+r,r); cx.lineTo(x+w,y+h-r);
    cx.arcTo(x+w,y+h,x+w-r,y+h,r); cx.lineTo(x+r,y+h);
    cx.arcTo(x,y+h,x,y+h-r,r); cx.lineTo(x,y+r);
    cx.arcTo(x,y,x+r,y,r); cx.closePath();
  }
}

function drawShape(shape,px,py,r,fill,stroke){
  cx.beginPath();
  switch(shape){
    case 0: cx.arc(px,py,r,0,Math.PI*2); break;
    case 1: cx.rect(px-r,py-r,r*2,r*2); break;
    case 2: cx.moveTo(px,py-r); cx.lineTo(px+r,py+r); cx.lineTo(px-r,py+r); cx.closePath(); break;
    case 3: cx.moveTo(px,py-r); cx.lineTo(px+r,py); cx.lineTo(px,py+r); cx.lineTo(px-r,py); cx.closePath(); break;
  }
  if(fill){ cx.fillStyle=fill; cx.fill(); }
  if(stroke){ cx.strokeStyle=stroke; cx.lineWidth=2; cx.stroke(); }
}

// ═══════════════════════════════════════════
//  PLAYER — точка света
// ═══════════════════════════════════════════
const P = {
  x:0, y:0, vy:0, r:18,
  letter:'А', jumps:0,
  trail:[], glow:0, flash:0,
  onGround:true, runStep:0,

  reset(){
    this.x = W*0.2; this.y = GY - this.r;
    this.vy=0; this.jumps=0; this.trail=[];
    this.glow=0; this.flash=0; this.runStep=0;
    this.letter = rndL();
  },

  jump(){
    if(this.jumps < 2){ this.vy = -H*0.021; this.jumps++; }
  },

  update(){
    this.vy += H*0.0011;
    this.y  += this.vy;
    const prevGround = this.onGround;
    if(this.y >= GY - this.r){
      this.y = GY-this.r; this.vy=0; this.jumps=0; this.onGround=true;
    } else { this.onGround=false; }

    // running bob when on ground
    if(this.onGround){
      this.runStep += 0.22;
      // dust every half-step
      if(Math.floor(this.runStep)%2===0 && rnd(1)<0.3){
        dustParts.push({x:this.x-this.r,y:GY,vx:-rnd(2)-0.5,vy:-rnd(1.5)-0.5,a:0.7,sz:rnd(3)+1});
      }
    }

    // push trail from slightly behind (creates forward-motion illusion)
    const trailX = this.x - this.r*0.5;
    const trailY = this.onGround ? this.y + Math.sin(this.runStep)*2 : this.y;
    this.trail.push({x:trailX, y:trailY, a:1});
    if(this.trail.length > 18) this.trail.shift();
    this.trail.forEach(t=>t.a -= 0.055);
    if(this.glow > 0) this.glow -= 0.04;
    if(this.flash > 0) this.flash -= 0.08;
  },

  draw(){
    const col = this.flash>0 ? '#ff4444' : CODE_COLOR[LETTER_MAP[this.letter]?.code||1];

    // speed lines — show forward motion
    cx.save(); cx.globalAlpha=0.18; cx.strokeStyle=col; cx.lineWidth=1.5;
    for(let i=0;i<5;i++){
      const lx = this.x - this.r*2 - i*12;
      const ly = this.y - 4 + i*2;
      cx.beginPath(); cx.moveTo(lx,ly); cx.lineTo(lx-18-i*4,ly); cx.stroke();
    }
    cx.restore();

    // trail (elongated to the left = running right)
    this.trail.forEach((t,i)=>{
      if(t.a<=0) return;
      cx.save(); cx.globalAlpha = t.a*0.4;
      cx.globalCompositeOperation='lighter';
      cx.fillStyle = col;
      cx.beginPath(); cx.arc(t.x,t.y,Math.max(0.01,this.r*t.a*0.65),0,Math.PI*2); cx.fill();
      cx.restore();
    });

    // outer glow
    cx.save(); cx.globalCompositeOperation='lighter';
    const gr = cx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r*(2.5+this.glow*1.5));
    gr.addColorStop(0, col+'bb'); gr.addColorStop(0.5, col+'44'); gr.addColorStop(1,'transparent');
    cx.fillStyle=gr; cx.beginPath(); cx.arc(this.x,this.y,this.r*(2.5+this.glow*1.5),0,Math.PI*2); cx.fill();
    cx.restore();

    // core — player takes the shape of the target block
    const bobY = this.onGround ? Math.sin(this.runStep)*2.5 : 0;
    const info = LETTER_MAP[this.letter] || {code:1, shape:0};
    const sh   = info.shape;
    const py   = this.y + bobY;
    cx.save();
    cx.shadowColor=col; cx.shadowBlur=28;
    drawShape(sh, this.x, py, this.r, '#ffffff', col);
    cx.restore();

    // letter on the player — dark absorbing halo for contrast
    cx.save();
    // dark circle behind the letter absorbs light from the shape
    cx.globalCompositeOperation='multiply';
    cx.fillStyle='rgba(0,0,0,0.72)';
    cx.beginPath(); cx.arc(this.x, py, this.r*0.72, 0, Math.PI*2); cx.fill();
    cx.globalCompositeOperation='source-over';
    cx.font=pxFont(this.r*1.05);
    cx.fillStyle='#ffffff';
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.shadowColor='#000000'; cx.shadowBlur=0;
    cx.fillText(this.letter, this.x, py+1);
    cx.restore();
  }
};

// ═══════════════════════════════════════════
//  BLOCKS
// ═══════════════════════════════════════════
function spawnBlock(){
  const isObs   = Math.random() < 0.22;
  const tCode   = LETTER_MAP[P.letter]?.code || 1;
  const code    = isObs ? 0 : (Math.random()<0.38 ? tCode : rndI(9)+1);
  const isRight = !isObs && code === tCode;
  const sz      = Math.round(H * 0.085) + rndI(Math.round(H * 0.04));
  const elevated= !isObs && Math.random()<0.3;
  const y       = elevated ? GY - sz - H*0.22 : GY - sz;
  const spd     = runSpeed;

  const playerShape = LETTER_MAP[P.letter]?.shape || 0;
  const shape = isRight ? playerShape : rndI(4);
  blocks.push({ x:W+sz, y, sz, code, isObs, isRight, spd, shape, done:false });
}

function updateBlocks(){
  if(deathFrame>=0) return; // don't process collisions while dying
  spawnT++;
  if(spawnT >= spawnI){ spawnT=0; spawnBlock(); spawnI=Math.max(22, Math.round((80-score*1.2)/SPEED_STEPS[speedIdx])); }
  blocks = blocks.filter(b=>b.x > -b.sz*2);

  blocks.forEach(b=>{
    b.x -= b.spd;
    if(b.done) return;
    const dist = Math.hypot(P.x-(b.x+b.sz/2), P.y-(b.y+b.sz/2));
    if(dist < P.r + b.sz*0.48){
      b.done=true;
      if(b.isRight){
        score++;
        P.glow=1.2;
        addParticles(P.x,P.y,CODE_COLOR[b.code],14);
        P.letter = rndL();
        if(score > hiScore){ hiScore=score; localStorage.setItem('nk_hi',hiScore); }
      } else {
        lives--;
        P.flash=1;
        addParticles(P.x,P.y,'#ff4444',8);
        if(lives<=0) deathFrame=0;
      }
    }
  });
}

function drawBlock(b){
  if(b.done) return;
  cx.save();
  if(b.isObs){
    cx.fillStyle='rgba(80,30,10,0.7)'; cx.strokeStyle='#8B4513'; cx.lineWidth=2;
    roundRect(b.x,b.y,b.sz,b.sz,6); cx.fill(); cx.stroke();
    cx.fillStyle='#cc4400'; cx.font=pxFont(b.sz*0.5);
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText('✕',b.x+b.sz/2,b.y+b.sz/2);
  } else {
    const col = CODE_COLOR[b.code];
    cx.fillStyle=col+'2a'; cx.strokeStyle=col; cx.lineWidth=2;
    cx.shadowColor=col; cx.shadowBlur=12;
    drawShape(b.shape, b.x+b.sz/2, b.y+b.sz/2, b.sz*0.46, col+'2a', col);
    cx.shadowBlur=0;
    cx.fillStyle=col; cx.font=`bold ${b.sz*0.38}px monospace`;
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText(b.code, b.x+b.sz/2, b.y+b.sz/2);
  }
  cx.restore();
}

// ═══════════════════════════════════════════
//  SPECIALS — трамплин / водоворот
// ═══════════════════════════════════════════
function updateSpecials(){
  specT++;
  if(specT>320 && Math.random()<0.008){
    specT=0;
    specials.push({ x:W+40, y:GY-28, type:Math.random()<0.5?'tramp':'vortex', spd:2.4 });
  }
  specials = specials.filter(s=>s.x>-80);
  specials.forEach(s=>{
    s.x -= s.spd;
    if(transitioning) return;
    const dist = Math.hypot(P.x-s.x, P.y-s.y);
    if(dist < P.r+28){
      const next = s.type==='tramp' ? 3 : (Math.random()<0.5?2:4);
      doTransition(next);
      specials = specials.filter(x=>x!==s);
    }
  });
}

function drawSpecials(){
  specials.forEach(s=>{
    cx.save();
    if(s.type==='tramp'){
      cx.fillStyle='#ffd700'; cx.strokeStyle='#ffaa00'; cx.lineWidth=2;
      cx.fillRect(s.x-28, s.y, 56, 10);
      cx.strokeRect(s.x-28, s.y, 56, 10);
      for(let i=0;i<3;i++){
        cx.beginPath();
        cx.moveTo(s.x-18+i*18, s.y+10);
        cx.lineTo(s.x-18+i*18, s.y+24);
        cx.stroke();
      }
      cx.fillStyle='#ffd700'; cx.font=pxFont(H*0.012);
      cx.textAlign='center'; cx.fillText('▲ ОБЛАКА',s.x,s.y-6);
    } else {
      cx.strokeStyle='#8b5cf6'; cx.lineWidth=2;
      cx.shadowColor='#8b5cf6'; cx.shadowBlur=15;
      for(let r=6;r<28;r+=8){
        cx.globalAlpha=(1-r/28)*0.9;
        cx.beginPath(); cx.arc(s.x,s.y,r+Math.sin(frame*0.1)*2,0,Math.PI*2); cx.stroke();
      }
      cx.globalAlpha=1; cx.shadowBlur=0;
      cx.fillStyle='#ce93d8'; cx.font=pxFont(H*0.012);
      cx.textAlign='center'; cx.fillText('▼ ВНИЗ',s.x,s.y-30);
    }
    cx.restore();
  });
}

function doTransition(newW){
  transitioning=true; transTimer=70; transName=WORLDS[newW].name;
  setTimeout(()=>{ worldIdx=newW; initBgDots(); blocks=[]; specials=[]; transitioning=false; },1100);
}

// ═══════════════════════════════════════════
//  PARTICLES
// ═══════════════════════════════════════════
function addParticles(x,y,col,n){
  for(let i=0;i<n;i++){
    const a=rnd(Math.PI*2), spd=1.5+rnd(3);
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-1.5,col,a:1,sz:2+rnd(4)});
  }
}

function updateDust(){
  dustParts = dustParts.filter(d=>d.a>0);
  dustParts.forEach(d=>{ d.x+=d.vx; d.y+=d.vy; d.vy-=0.05; d.a-=0.06; });
}

function drawDust(){
  dustParts.forEach(d=>{
    cx.save(); cx.globalAlpha=d.a*0.5;
    cx.fillStyle=WORLDS[worldIdx].top;
    cx.beginPath(); cx.arc(d.x,d.y,d.sz,0,Math.PI*2); cx.fill();
    cx.restore();
  });
}

function updateParticles(){
  particles = particles.filter(p=>p.a>0);
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.vx*=0.95; p.a-=0.035; });
}

function drawParticles(){
  particles.forEach(p=>{
    if(p.a<=0) return;
    cx.save(); cx.globalAlpha=p.a; cx.globalCompositeOperation='lighter';
    cx.fillStyle=p.col;
    cx.beginPath(); cx.arc(p.x,p.y,Math.max(0.01,p.sz*p.a),0,Math.PI*2); cx.fill();
    cx.restore();
  });
}

// ═══════════════════════════════════════════
//  HEARTS (collectible lives)
// ═══════════════════════════════════════════
function updateHearts(){
  heartT++;
  if(heartT > 300+rndI(200) && lives < MAX_LIVES){
    heartT=0;
    const elevated = Math.random()<0.4;
    const hy = elevated ? GY - H*0.22 - H*0.04 : GY - H*0.05;
    hearts.push({x:W+30, y:hy, done:false});
  }
  hearts = hearts.filter(h=>h.x > -50);
  hearts.forEach(h=>{
    h.x -= runSpeed;
    if(h.done) return;
    const dist = Math.hypot(P.x-h.x, P.y-h.y);
    if(dist < P.r + H*0.04){
      h.done=true;
      lives = Math.min(MAX_LIVES, lives+1);
      addParticles(h.x, h.y, '#ff6b9d', 12);
    }
  });
}

function drawHearts(){
  hearts.forEach(h=>{
    if(h.done) return;
    const bob = Math.sin(frame*0.1 + h.x*0.005)*H*0.008;
    cx.save();
    cx.font=pxFont(H*0.055);
    cx.fillStyle='#ff6b9d';
    cx.shadowColor='#ff6b9d'; cx.shadowBlur=22;
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.globalCompositeOperation='lighter';
    cx.fillText('♥', h.x, h.y+bob);
    cx.restore();
  });
}

// ═══════════════════════════════════════════
//  WORLD BACKGROUND
// ═══════════════════════════════════════════
function initBgDots(){
  bgDots=[];
  for(let i=0;i<35;i++)
    bgDots.push({x:rnd(W),y:rnd(GY),sz:rnd(2.5)+0.5,spd:rnd(0.6)+0.15,op:rnd(0.5)+0.2});
}

function drawWorld(){
  const w=WORLDS[worldIdx];
  // sky
  const sg=cx.createLinearGradient(0,0,0,GY);
  sg.addColorStop(0,w.sky); sg.addColorStop(1,w.sky+'88');
  cx.fillStyle=sg; cx.fillRect(0,0,W,GY);

  // background dots scroll at run speed to show motion
  bgDots.forEach(d=>{
    d.x -= d.spd + runSpeed*0.4; if(d.x<-2)d.x=W+2;
    d.y+=Math.sin(frame*0.02+d.x*0.01)*0.4;
    cx.save(); cx.globalAlpha=d.op;
    cx.fillStyle=w.ptc;
    cx.beginPath(); cx.arc(d.x,d.y,d.sz,0,Math.PI*2); cx.fill();
    cx.restore();
  });

  // world deco
  if(worldIdx===2){ // underwater caustics
    cx.save(); cx.globalAlpha=0.07; cx.strokeStyle='#00aaff'; cx.lineWidth=1.5;
    for(let i=0;i<4;i++){
      const sx=(frame*0.4+i*W/4)%W;
      cx.beginPath(); cx.moveTo(sx,0); cx.lineTo(sx+40,GY); cx.stroke();
    }
    cx.restore();
  } else if(worldIdx===3){ // clouds
    cx.save(); cx.fillStyle='rgba(255,255,255,0.18)';
    for(let i=0;i<4;i++){
      const cx2=(i*W/3+(frame*0.25))%W;
      cx.beginPath(); cx.arc(cx2,GY*0.25,W*0.07,0,Math.PI*2);
      cx.arc(cx2+W*0.05,GY*0.25-W*0.025,W*0.05,0,Math.PI*2);
      cx.fill();
    }
    cx.restore();
  } else if(worldIdx===4){ // underground crystals
    cx.save(); cx.globalAlpha=0.18; cx.fillStyle=w.acc;
    for(let i=0;i<6;i++){
      const bx=i*(W/5)+W*0.05;
      cx.beginPath(); cx.moveTo(bx,GY); cx.lineTo(bx-10,GY-35); cx.lineTo(bx+10,GY-35); cx.closePath();
      cx.fill();
    }
    cx.restore();
  }

  // ground
  cx.fillStyle=w.gnd; cx.fillRect(0,GY,W,H-GY);
  cx.fillStyle=w.top; cx.fillRect(0,GY,W,7);

  // transition overlay
  if(transitioning){
    transTimer--;
    const fade=transTimer/70;
    cx.fillStyle=`rgba(0,0,0,${0.85*fade})`;
    cx.fillRect(0,0,W,H);
    cx.save();
    cx.font=pxFont(H*0.055);
    cx.fillStyle='#ffd700'; cx.textAlign='center'; cx.textBaseline='middle';
    cx.shadowColor='#ffd700'; cx.shadowBlur=40;
    cx.fillText(transName,W/2,H/2);
    cx.restore();
  }
}

// ═══════════════════════════════════════════
//  HUD
// ═══════════════════════════════════════════
function drawHUD(){
  const lc  = LETTER_MAP[P.letter]?.code || 1;
  const col = CODE_COLOR[lc];

  // score — top left
  cx.save();
  cx.font=pxFont(H*0.03); cx.fillStyle='#ffd700';
  cx.textAlign='left'; cx.shadowColor='#ffd700'; cx.shadowBlur=8;
  cx.fillText('✦ '+score, W*0.03, H*0.048);
  cx.font=pxFont(H*0.016); cx.fillStyle='rgba(255,215,0,0.45)'; cx.shadowBlur=0;
  cx.fillText('РЕК: '+hiScore, W*0.03, H*0.072);
  cx.restore();

  // lives — top right (5 hearts)
  cx.save();
  cx.font=pxFont(H*0.03); cx.textAlign='center'; cx.textBaseline='middle';
  for(let i=0;i<MAX_LIVES;i++){
    cx.fillStyle   = i<lives ? '#ff6b9d' : 'rgba(255,107,157,0.15)';
    cx.shadowColor = i<lives ? '#ff6b9d' : 'transparent';
    cx.shadowBlur  = i<lives ? 10 : 0;
    cx.globalCompositeOperation = i<lives ? 'lighter' : 'source-over';
    cx.fillText('♥', W-W*0.04-i*W*0.052, H*0.048);
  }
  cx.restore();

  // ── FULL CODE TABLE ─────────────────────────
  const ty    = H*0.088;
  const th    = H*0.155;   // tall enough for big text
  const cellW = W / 9;

  cx.save();
  cx.fillStyle='rgba(0,0,18,0.88)';
  cx.fillRect(0, ty - H*0.012, W, th + H*0.036);

  // label above table
  cx.font=pxFont(H*0.019); cx.fillStyle='rgba(255,255,255,0.8)';
  cx.textAlign='center'; cx.textBaseline='bottom';
  cx.fillText('ТВОЯ БУКВА  ' + P.letter + '  →  ИЩЕШЬ КОД  ' + lc, W/2, ty - H*0.014);

  for(let code=1; code<=9; code++){
    const ccx      = (code - 0.5) * cellW;
    const isTarget = (code === lc);
    const acol     = CODE_COLOR[code];

    if(isTarget){
      cx.fillStyle = acol + '40';
      roundRect(ccx - cellW*0.47, ty - H*0.006, cellW*0.94, th + H*0.012, 10);
      cx.fill();
      cx.strokeStyle=acol; cx.lineWidth=2.5; cx.stroke();
      cx.shadowColor=acol; cx.shadowBlur=24;
    } else {
      cx.shadowBlur=0;
    }

    // code digit
    cx.font=pxFont(isTarget ? H*0.058 : H*0.042);
    cx.fillStyle = isTarget ? acol : acol+'dd';
    cx.textAlign='center'; cx.textBaseline='top';
    cx.fillText(code, ccx, ty + H*0.008);

    // letters — large and readable
    cx.shadowBlur=0;
    cx.font=pxFont(isTarget ? H*0.028 : H*0.024);
    cx.fillStyle = isTarget ? '#ffffff' : 'rgba(255,255,255,0.8)';
    cx.fillText(CODE_LETTERS[code].join(''), ccx, ty + H*0.075);
  }
  cx.restore();

  // world name — small, right side, below table
  cx.save();
  cx.font=pxFont(H*0.014); cx.fillStyle=WORLDS[worldIdx].acc+'66';
  cx.textAlign='right'; cx.textBaseline='top';
  cx.fillText(WORLDS[worldIdx].name, W-W*0.03, ty+th+H*0.008);
  cx.restore();

  // jump hint (first 5 sec)
  if(frame<300){
    cx.save(); cx.globalAlpha=1-frame/300;
    cx.font=pxFont(H*0.02); cx.fillStyle='rgba(255,255,255,0.7)';
    cx.textAlign='center'; cx.fillText('TAP / ПРОБЕЛ → ПРЫЖОК', W/2, H*0.92);
    cx.restore();
  }

  // ↺ restart button — bottom left
  const rbw=H*0.1, rbh=H*0.065, rbx=W*0.03, rby=H*0.88;
  hudRestartRect={x:rbx,y:rby,w:rbw,h:rbh};
  cx.save();
  cx.fillStyle='rgba(255,100,100,0.12)'; cx.strokeStyle='rgba(255,100,100,0.5)'; cx.lineWidth=1.5;
  roundRect(rbx,rby,rbw,rbh,rbh/2); cx.fill(); cx.stroke();
  cx.font=pxFont(H*0.03); cx.fillStyle='rgba(255,160,160,0.9)';
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText('↺', rbx+rbw/2, rby+rbh/2);
  cx.restore();

  // speed control [◀] 1.6× [▶] — bottom right
  const sbh=H*0.065, sbtnW=H*0.075, slabelW=H*0.14;
  const sbBase = W - W*0.03 - sbtnW*2 - slabelW;
  const sby    = H*0.88;
  hudSpeedMinus={x:sbBase,                y:sby, w:sbtnW,    h:sbh};
  hudSpeedPlus ={x:sbBase+sbtnW+slabelW,  y:sby, w:sbtnW,    h:sbh};

  cx.save();
  cx.lineWidth=1.5;
  cx.fillStyle='rgba(100,180,255,0.12)'; cx.strokeStyle='rgba(100,180,255,0.45)';
  roundRect(hudSpeedMinus.x,sby,sbtnW,sbh,sbh/2); cx.fill(); cx.stroke();
  cx.font=pxFont(H*0.028); cx.fillStyle='rgba(150,210,255,0.9)';
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText('◀', hudSpeedMinus.x+sbtnW/2, sby+sbh/2);

  cx.font=pxFont(H*0.024); cx.fillStyle='#ffd700';
  cx.shadowColor='#ffd700'; cx.shadowBlur=8;
  cx.fillText(SPEED_LABELS[speedIdx], sbBase+sbtnW+slabelW/2, sby+sbh/2);
  cx.shadowBlur=0;

  cx.fillStyle='rgba(100,180,255,0.12)'; cx.strokeStyle='rgba(100,180,255,0.45)';
  roundRect(hudSpeedPlus.x,sby,sbtnW,sbh,sbh/2); cx.fill(); cx.stroke();
  cx.fillStyle='rgba(150,210,255,0.9)';
  cx.fillText('▶', hudSpeedPlus.x+sbtnW/2, sby+sbh/2);
  cx.restore();
}

let qBtns=[];

function genQuestion(d){
  const letter = rndL();
  const info   = LETTER_MAP[letter];
  if(d===1){
    const opts = shuffle([...new Set([info.code, ...Array.from({length:10},()=>rndI(9)+1)])]).slice(0,4);
    return {type:1,letter,ans:info.code,opts};
  } else if(d===2){
    const pool = shuffle([...ALL_LETTERS]).slice(0,4);
    if(!pool.includes(letter)) pool[0]=letter;
    shuffle(pool);
    return {type:2,shape:info.shape,code:info.code,letter,ans:letter,opts:pool};
  } else {
    const nOpts = shuffle([...new Set([info.code,...Array.from({length:10},()=>rndI(9)+1)])]).slice(0,4);
    return {type:3,letter,ansCode:info.code,ansShape:info.shape,nOpts,sOpts:[0,1,2,3],selN:null,selS:null};
  }
}

function drawQuiz(){
  cx.fillStyle='#0a0a1a'; cx.fillRect(0,0,W,H);
  qBtns=[];

  if(!qQuestion) qQuestion=genQuestion(qDiff);
  const q=qQuestion;

  // score
  cx.save();
  cx.font=pxFont(H*0.03); cx.fillStyle='#ffd700';
  cx.textAlign='left'; cx.fillText('✦ '+qScore, W*0.04, H*0.055);
  if(qStreak>=2){
    cx.fillStyle='#00d4aa'; cx.textAlign='right';
    cx.fillText('x'+qStreak+'!', W-W*0.04, H*0.055);
  }
  cx.restore();

  const QY=H*0.24;

  if(q.type===1){
    const col=CODE_COLOR[q.ans];
    cx.save();
    cx.font=pxFont(H*0.15); cx.fillStyle=col;
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.shadowColor=col; cx.shadowBlur=50;
    cx.fillText(q.letter,W/2,QY);
    cx.shadowBlur=0; cx.font=pxFont(H*0.022);
    cx.fillStyle='rgba(255,255,255,0.5)'; cx.textBaseline='bottom';
    cx.fillText('Какой код у этой буквы?',W/2,QY-H*0.09);
    cx.restore();
    q.opts.forEach((o,i)=>qBtn(o,i,q,o===q.ans,o));

  } else if(q.type===2){
    const col=CODE_COLOR[q.code];
    cx.save();
    cx.shadowColor=col; cx.shadowBlur=30;
    drawShape(q.shape,W/2,QY,H*0.07,col+'44',col);
    cx.fillStyle=col; cx.font=pxFont(H*0.038);
    cx.textAlign='center'; cx.textBaseline='top';
    cx.fillText(q.code,W/2,QY+H*0.08);

    cx.fillStyle='rgba(255,255,255,0.5)'; cx.textBaseline='bottom';
    cx.fillText('Какая буква?',W/2,QY-H*0.09);
    cx.restore();
    q.opts.forEach((o,i)=>{
      const oc=CODE_COLOR[LETTER_MAP[o]?.code||1];
      qBtn(o,i,q,o===q.ans,o,oc);
    });

  } else { // hard
    const col=CODE_COLOR[q.ansCode];
    cx.save();
    cx.font=pxFont(H*0.1); cx.fillStyle=col;
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.shadowColor=col; cx.shadowBlur=40;
    cx.fillText(q.letter,W/2,QY);
    cx.shadowBlur=0; cx.font=pxFont(H*0.02);
    cx.fillStyle='rgba(255,255,255,0.5)'; cx.textBaseline='bottom';
    cx.fillText('Выбери КОД и ФИГУРУ',W/2,QY-H*0.07);
    cx.restore();

    cx.save(); cx.font=pxFont(H*0.018); cx.fillStyle='rgba(255,215,0,0.6)';
    cx.textAlign='left'; cx.fillText('КОД:',W*0.04,H*0.52);
    cx.restore();
    q.nOpts.forEach((o,i)=>{
      const bw=W*0.21, bh=H*0.07, bx=W*0.04+i*(bw+W*0.015), by=H*0.535;
      qBtns.push({x:bx,y:by,w:bw,h:bh,v:o,kind:'n'});
      const sel=q.selN===o, ok=qResult!==null&&o===q.ansCode, bad=qResult!==null&&sel&&o!==q.ansCode;
      cx.save();
      cx.fillStyle=ok?'rgba(0,212,170,0.3)':bad?'rgba(255,100,100,0.3)':sel?'rgba(255,215,0,0.2)':'rgba(255,215,0,0.07)';
      cx.strokeStyle=ok?'#00d4aa':bad?'#ff6666':sel?'#ffd700':'rgba(255,215,0,0.35)';
      cx.lineWidth=1.5;
      roundRect(bx,by,bw,bh,10); cx.fill(); cx.stroke();
      cx.font=pxFont(H*0.04); cx.fillStyle=CODE_COLOR[o];
      cx.textAlign='center'; cx.textBaseline='middle';
      cx.fillText(o,bx+bw/2,by+bh/2);
      cx.restore();
    });

    cx.save(); cx.font=pxFont(H*0.018); cx.fillStyle='rgba(255,215,0,0.6)';
    cx.textAlign='left'; cx.fillText('ФИГУРА:',W*0.04,H*0.65);
    cx.restore();
    [0,1,2,3].forEach((sh,i)=>{
      const bw=W*0.21, bh=H*0.08, bx=W*0.04+i*(bw+W*0.015), by=H*0.665;
      qBtns.push({x:bx,y:by,w:bw,h:bh,v:sh,kind:'s'});
      const sel=q.selS===sh, ok=qResult!==null&&sh===q.ansShape, bad=qResult!==null&&sel&&sh!==q.ansShape;
      cx.save();
      cx.fillStyle=ok?'rgba(0,212,170,0.3)':bad?'rgba(255,100,100,0.3)':sel?'rgba(255,215,0,0.2)':'rgba(255,215,0,0.07)';
      cx.strokeStyle=ok?'#00d4aa':bad?'#ff6666':sel?'#ffd700':'rgba(255,215,0,0.35)';
      cx.lineWidth=1.5;
      roundRect(bx,by,bw,bh,10); cx.fill(); cx.stroke();
      cx.shadowBlur=0;
      drawShape(sh,bx+bw/2,by+bh/2,bh*0.3,col+'66',col);
      cx.restore();
    });

    if(q.selN!==null&&q.selS!==null&&qResult===null){
      const bw=W*0.4, bh=H*0.065, bx=W/2-bw/2, by=H*0.79;
      qBtns.push({x:bx,y:by,w:bw,h:bh,v:'check',kind:'ok'});
      cx.save();
      cx.fillStyle='rgba(0,212,170,0.2)'; cx.strokeStyle='#00d4aa'; cx.lineWidth=2;
      roundRect(bx,by,bw,bh,bh/2); cx.fill(); cx.stroke();
      cx.font=pxFont(H*0.028); cx.fillStyle='#00d4aa';
      cx.textAlign='center'; cx.textBaseline='middle';
      cx.fillText('ПРОВЕРИТЬ',W/2,by+bh/2);
      cx.restore();
    }
  }

  // result feedback
  if(qResult!==null){
    const ok = q.type===3 ? qResult : qResult===q.ans;
    cx.save();
    cx.font=pxFont(H*0.04); cx.fillStyle=ok?'#00d4aa':'#ff6666';
    cx.textAlign='center'; cx.textBaseline='bottom';
    cx.shadowColor=cx.fillStyle; cx.shadowBlur=25;
    cx.fillText(ok?'✦ ВЕРНО!':'✕ НЕВЕРНО', W/2, H*0.94);
    cx.restore();
  }

  cx.save(); cx.font=pxFont(H*0.017); cx.fillStyle='rgba(255,215,0,0.35)';
  cx.textAlign='right'; cx.fillText(['','ЛЁГКИЙ','СРЕДНИЙ','СЛОЖНЫЙ'][qDiff], W-W*0.04, H*0.985);
  cx.restore();

  backBtn();
}

  cx.font=pxFont(H*0.044); cx.fillStyle='#ffd700';
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText('↺  НАЧАТЬ ЗАНОВО', W/2, by+bh/2);
  cx.restore();

  // menu button
  const mw=W*0.4, mh=H*0.065, mx=W/2-mw/2, my=H*0.78;
  menuBtns.push({x:mx, y:my, w:mw, h:mh, a:'menu'});
  cx.save();
  cx.fillStyle='rgba(255,215,0,0.05)'; cx.strokeStyle='rgba(255,215,0,0.2)'; cx.lineWidth=1;
  roundRect(mx,my,mw,mh,mh/2); cx.fill(); cx.stroke();
  cx.font=pxFont(H*0.024); cx.fillStyle='rgba(255,215,0,0.35)';
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText('◀ МЕНЮ', W/2, my+mh/2);
  cx.restore();
}

// ═══════════════════════════════════════════
//  BACK BUTTON
// ═══════════════════════════════════════════
let backBtnRect={x:0,y:0,w:0,h:0};
let hudRestartRect={x:0,y:0,w:0,h:0};
let hudSpeedMinus={x:0,y:0,w:0,h:0};
let hudSpeedPlus={x:0,y:0,w:0,h:0};
function backBtn(){
  const bw=W*0.26, bh=H*0.055, bx=W*0.04, by=H-H*0.08;
  backBtnRect={x:bx,y:by,w:bw,h:bh};
  cx.save();
  cx.fillStyle='rgba(255,215,0,0.08)'; cx.strokeStyle='rgba(255,215,0,0.4)'; cx.lineWidth=1;
  roundRect(bx,by,bw,bh,bh/2); cx.fill(); cx.stroke();
  cx.font=pxFont(H*0.022); cx.fillStyle='#ffd700';
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText('◀ МЕНЮ',bx+bw/2,by+bh/2);
  cx.restore();
}

function hitBack(x,y){
  const b=backBtnRect;
  return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;
}

// ═══════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════
function toCanvas(ex,ey){
  const r=cv.getBoundingClientRect();
  return [(ex-r.left)*(W/r.width), (ey-r.top)*(H/r.height)];
}

function onTap(ex,ey){
  const [x,y]=toCanvas(ex,ey);

  if(screen==='runner'){
    const r=hudRestartRect;
    if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){ doMenuAction('run'); return; }
    const sm=hudSpeedMinus, sp=hudSpeedPlus;
    if(x>=sm.x&&x<=sm.x+sm.w&&y>=sm.y&&y<=sm.y+sm.h){ speedIdx=Math.max(0,speedIdx-1); return; }
    if(x>=sp.x&&x<=sp.x+sp.w&&y>=sp.y&&y<=sp.y+sp.h){ speedIdx=Math.min(SPEED_STEPS.length-1,speedIdx+1); return; }
    P.jump(); return;
  }

  if(screen==='gameover'){
    let handled=false;
    menuBtns.forEach(b=>{ if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){ doMenuAction(b.a); handled=true; } });
    if(!handled) doMenuAction('run');
    return;
  }

  if(screen==='menu'){
    menuBtns.forEach(b=>{
      if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h) doMenuAction(b.a);
    });
    return;
  }

  if(screen==='quiz-select'){
    if(hitBack(x,y)){ screen='menu'; return; }
    diffBtns.forEach(b=>{
      if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){
        qDiff=b.d; qQuestion=null; qResult=null; qResultT=0;
        qScore=0; qStreak=0; screen='quiz';
      }
    });
    return;
  }

  if(screen==='quiz'){
    if(hitBack(x,y)){ screen='quiz-select'; qQuestion=null; return; }
    if(qResult!==null) return;
    qBtns.forEach(b=>{
      if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){
        if(b.kind==='opt'){
          const ok=b.v===qQuestion.ans;
          qResult=b.v;
          if(ok){ qScore+=10*(qStreak>=2?2:1); qStreak++; addParticles(W/2,H*0.5,'#00d4aa',10); }
          else  { qStreak=0; addParticles(W/2,H*0.5,'#ff4444',6); }
          qResultT=65;
        } else if(b.kind==='n'){ qQuestion.selN=b.v; }
        else if(b.kind==='s'){ qQuestion.selS=b.v; }
        else if(b.kind==='ok'){
          const ok=qQuestion.selN===qQuestion.ansCode&&qQuestion.selS===qQuestion.ansShape;
          qResult=ok;
          if(ok){ qScore+=20*(qStreak>=2?2:1); qStreak++; addParticles(W/2,H*0.5,'#00d4aa',14); }
          else  { qStreak=0; addParticles(W/2,H*0.5,'#ff4444',7); }
          qResultT=65;
        }
      }
    });
    return;
  }

  if(screen==='ref'){
    if(hitBack(x,y)){ screen='menu'; }
    return;
  }
}

function doMenuAction(a){
  switch(a){
    case 'run':
      deathFrame=-1; hearts=[]; heartT=0;
      score=0; lives=MAX_LIVES; blocks=[]; particles=[]; specials=[]; dustParts=[];
      spawnT=0; spawnI=80; specT=0; frame=0; transitioning=false; runSpeed=3.5;
      worldIdx=rndI(WORLDS.length);
      initBgDots(); P.reset(); screen='runner'; break;
    case 'qs':
      qQuestion=null; qScore=0; qStreak=0; screen='quiz-select'; break;
    case 'ref':
      refScroll=0; screen='ref'; break;
    case 'menu':
      screen='menu'; initMenuOrbs(); menuBtns=[]; break;
    case 'prana':
      window.location.href='index.html'; break;
  }
}

cv.addEventListener('pointerdown', e=>{ onTap(e.clientX,e.clientY); });
document.addEventListener('keydown', e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){
    e.preventDefault();
    if(screen==='runner') P.jump();
    else if(screen==='gameover') doMenuAction('run');
  }
});

// ref scroll
let refTouchY=0;
cv.addEventListener('touchstart', e=>{ refTouchY=e.touches[0].clientY; },{passive:true});
cv.addEventListener('touchmove', e=>{
  if(screen==='ref'){
    const dy=e.touches[0].clientY-refTouchY;
    refScroll+=dy; refTouchY=e.touches[0].clientY;
    refScroll=Math.min(0,refScroll);
  }
},{passive:true});

// ═══════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════
function loop(){
  frame++;
  cx.clearRect(0,0,W,H);

  switch(screen){
    case 'menu':      drawMenu(); break;
    case 'quiz-select': drawQuizSelect(); break;
    case 'quiz':
      drawQuiz();
      if(qResult!==null){ qResultT--; if(qResultT<=0){ qResult=null; qQuestion=genQuestion(qDiff); } }
      updateParticles(); drawParticles();
      break;
    case 'runner':
      runSpeed = (W * 0.008 + score * 0.04) * SPEED_STEPS[speedIdx];
      drawWorld();
      updateSpecials(); drawSpecialObjects();
      updateDust(); drawDust();
      P.update(); updateBlocks(); updateHearts();
      blocks.forEach(drawBlock); drawHearts();
      P.draw();
      updateParticles(); drawParticles();
      drawHUD();
      // death flash + transition (no setTimeout — pure frame counter)
      if(deathFrame>=0){
        const flashA = Math.max(0, 0.55*(1-deathFrame/20));
        cx.fillStyle=`rgba(255,0,0,${flashA})`; cx.fillRect(0,0,W,H);
        deathFrame++;
        if(deathFrame>=20){ screen='gameover'; deathFrame=-1; }
      }
      break;
    case 'gameover':
      drawGameOver();
      updateParticles(); drawParticles();
      break;
    case 'ref':
      drawRef();
      break;
  }

  requestAnimationFrame(loop);
}

function drawSpecialObjects(){ drawSpecials(); }

initMenuOrbs();
loop();
</script>
