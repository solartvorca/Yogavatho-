<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Нейро-Код: Игра 3.0</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; overflow: hidden; font-family: monospace; touch-action: none; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// ===================== ДАННЫЕ =====================
const GROUPS = {
  1:['И','С','Э'],     2:['А','Й','П','Т'],
  3:['Б','З','М','Ю'], 4:['В','К','Ф','Я'],
  5:['Д','Л','Х','Ы'], 6:['Е','О','Ц','Ь'],
  7:['Ё','Н','Ъ'],     8:['Г','У','Ч','Щ'],
  9:['Ж','Р','Ш']
};
const CLR = {
  1:'#ff5f5f', 2:'#ffd700', 3:'#2ecc71',
  4:'#1ab8b8', 5:'#4d88ff', 6:'#7dce82',
  7:'#aaaaaa', 8:'#ff4d8f', 9:'#9b59b6'
};
const SHAPES   = ['circle','roundRect','triangle','diamond'];
const SYM_OUT  = ['○','□','△','◇'];
const SYM_FILL = ['●','■','▲','◆'];

const ALL = Object.entries(GROUPS).flatMap(([code, arr]) =>
  arr.map((letter, i) => ({ letter, code: +code, si: i % 4, color: CLR[code] }))
);

function rand() { return ALL[Math.random() * ALL.length | 0]; }

// ===================== CANVAS =====================
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H, DPR;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width  = W * DPR; canvas.height = H * DPR;
  canvas.style.width  = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

// ===================== SHAPE DRAWING =====================
function drawShape(x, y, r, shape, color, glow) {
  ctx.save();
  ctx.fillStyle = color;
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  ctx.beginPath();
  if (shape === 'circle') {
    ctx.arc(x, y, r, 0, Math.PI * 2);
  } else if (shape === 'roundRect') {
    const s = r * 0.82, cr = s * 0.38;
    ctx.roundRect(x - s, y - s, s * 2, s * 2, cr);
  } else if (shape === 'triangle') {
    ctx.moveTo(x, y - r);
    ctx.lineTo(x + r * 0.9, y + r * 0.6);
    ctx.lineTo(x - r * 0.9, y + r * 0.6);
  } else {
    ctx.moveTo(x, y - r);
    ctx.lineTo(x + r * 0.65, y);
    ctx.lineTo(x, y + r);
    ctx.lineTo(x - r * 0.65, y);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}

// ===================== STATE =====================
let screen   = 'menu';   // menu | game | help | gameover
let tick     = 0;

// ---- game ----
const MAX_STACK = 6;
let stacks, stackLtrs, cur, pieceY, fallDur, fallT;
let gstate; // 'falling' | 'result'
let resTimer, resOk, tapped, deathCol;
let score, hi = +localStorage.getItem('nt3_hi') || 0;
let streak, level, nOk, nTotal;
let showHint = true;
let particles = [];

// ---- menu orbs ----
const orbs = Array.from({length:9}, (_,i) => ({
  x: Math.random()*400, y: Math.random()*800,
  vx:(Math.random()-.5)*.6, vy:(Math.random()-.5)*.6,
  code:i+1, r:26+Math.random()*10, ph:Math.random()*Math.PI*2
}));

// ===================== LAYOUT =====================
function L() {
  const topH = Math.min(H*.075, 54);
  const hdrH = Math.min(H*.115, 84);
  const bot  = topH + hdrH;
  const playH = H - bot;
  const cw   = W / 4;
  const cx   = c => c * cw + cw / 2;
  const ch   = playH / MAX_STACK;
  return { topH, hdrH, bot, playH, cw, cx, ch };
}

// ===================== PARTICLES =====================
function burst(x, y, color, n=14) {
  for (let i=0;i<n;i++) {
    const a = Math.PI*2*i/n + Math.random()*.4;
    const sp = 2 + Math.random()*4;
    particles.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:40+Math.random()*20, color });
  }
}

function tickParticles() {
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    ctx.save(); ctx.globalAlpha = p.life/60;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    p.x += p.vx; p.y += p.vy; p.vy += .14; p.life--;
  }
}

// ===================== GAME LOGIC =====================
function startGame() {
  stacks = [0,0,0,0]; stackLtrs = [[],[],[],[]];
  score=0; streak=0; level=1; nOk=0; nTotal=0;
  fallDur=300; particles=[]; deathCol=-1;
  spawnPiece(); screen='game'; tick=0;
}

function spawnPiece() {
  cur=rand(); pieceY=0; fallT=0;
  gstate='falling'; tapped=-1; resOk=false;
}

function choose(col) {
  if (gstate !== 'falling') return;
  tapped = col; nTotal++;
  const l = L();
  if (col === cur.si) {
    streak++;
    const pts = 10 * Math.min(streak,5) * level;
    score += pts; nOk++;
    resOk = true;
    burst(l.cx(col), l.bot - 30, cur.color);
    if (nOk % 20 === 0) { level = Math.min(level+1,9); fallDur = Math.max(100, 300 - level*22); }
  } else {
    streak = 0;
    stacks[col]++;
    if (stackLtrs[col].length < MAX_STACK) stackLtrs[col].push(cur.letter);
    resOk = false;
    if (stacks[col] >= MAX_STACK) {
      deathCol = col;
      if (score > hi) { hi = score; localStorage.setItem('nt3_hi', hi); }
      resTimer = 90; gstate = 'result'; return;
    }
  }
  resTimer = resOk ? 32 : 55;
  gstate = 'result';
}

function onTimeout() {
  if (gstate !== 'falling') return;
  tapped = -1; nTotal++; streak = 0;
  // timeout: block lands in correct column (penalises forgetting shapes)
  const col = cur.si;
  stacks[col]++;
  if (stackLtrs[col].length < MAX_STACK) stackLtrs[col].push(cur.letter);
  resOk = false;
  if (stacks[col] >= MAX_STACK) {
    deathCol = col;
    if (score > hi) { hi = score; localStorage.setItem('nt3_hi', hi); }
    resTimer = 90; gstate = 'result'; return;
  }
  resTimer = 50; gstate = 'result';
}

// ===================== DRAW: GAME =====================
function drawGame() {
  const { topH, hdrH, bot, playH, cw, cx, ch } = L();

  // bg
  ctx.fillStyle = '#0a0a1a'; ctx.fillRect(0,0,W,H);

  // ---- TOP BAR ----
  ctx.fillStyle = 'rgba(15,10,30,.97)'; ctx.fillRect(0,0,W,topH);
  const tsz = Math.min(topH*.42, 17);
  ctx.font = `bold ${tsz}px monospace`; ctx.textBaseline = 'middle';

  ctx.fillStyle = '#ffd700'; ctx.textAlign = 'left';
  ctx.fillText(`★ ${score}`, 10, topH/2);

  ctx.fillStyle = '#aaffee'; ctx.textAlign = 'center';
  ctx.fillText(`ЛВЛ ${level}`, W/2, topH/2);

  ctx.textAlign = 'right';
  ctx.fillStyle = streak >= 3 ? '#ff6b9d' : '#ffec8b';
  ctx.fillText(streak >= 2 ? `×${streak}` : `${nOk}/${nTotal}`, W-10, topH/2);
  ctx.textBaseline = 'alphabetic';

  // ---- COLUMN HEADERS ----
  for (let c=0; c<4; c++) {
    const X = c * cw;
    const danger = stacks[c] / MAX_STACK;

    ctx.fillStyle = danger > .5 ? `rgba(255,60,60,${.06+danger*.14})` : `rgba(255,215,0,${.04+danger*.06})`;
    ctx.fillRect(X, topH, cw, hdrH);

    const shR = hdrH * .27;
    const shC = danger > .6 ? '#ff7777' : '#cccccc';
    drawShape(cx(c), topH + hdrH*.44, shR, SHAPES[c], shC, danger>.6 ? 10 : 4);

    ctx.fillStyle = danger > .6 ? '#ff8888' : '#999999';
    ctx.font = `bold ${Math.min(hdrH*.22,13)}px monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(SYM_OUT[c], cx(c), topH + hdrH - 8);

    if (stacks[c] >= MAX_STACK-1) {
      const pulse = .35 + .35*Math.sin(tick*.15);
      ctx.strokeStyle = `rgba(255,0,0,${pulse})`; ctx.lineWidth = 2.5;
      ctx.strokeRect(X+1, topH+1, cw-2, hdrH-2);
    }
    if (c>0) {
      ctx.strokeStyle = 'rgba(255,215,0,.1)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(X, topH); ctx.lineTo(X, H); ctx.stroke();
    }
  }
  ctx.strokeStyle = 'rgba(255,215,0,.18)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, bot); ctx.lineTo(W, bot); ctx.stroke();

  // ---- STACKS ----
  for (let c=0; c<4; c++) {
    const n = stacks[c]; if (!n) continue;
    const d = n / MAX_STACK;
    for (let s=0; s<n; s++) {
      const bx = c*cw, by = bot + playH - (s+1)*ch;
      const pad = 4;
      rrect(bx+pad, by+pad, cw-pad*2, ch-pad*2, 5);
      ctx.fillStyle = `rgba(${Math.round(100+d*130)},${Math.round(35*(1-d))},${Math.round(35*(1-d))},.55)`;
      ctx.fill();
      ctx.strokeStyle = `rgba(255,${Math.round(90*(1-d))},${Math.round(90*(1-d))},.55)`;
      ctx.lineWidth = 1.5; ctx.stroke();

      if (stackLtrs[c][s]) {
        ctx.fillStyle = `rgba(255,${Math.round(160*(1-d))},${Math.round(160*(1-d))},.75)`;
        ctx.font = `bold ${Math.min(ch*.48,22)}px monospace`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(stackLtrs[c][s], c*cw+cw/2, by+ch/2);
        ctx.textBaseline = 'alphabetic';
      }
    }
  }

  // ---- PIECE ----
  const py  = bot + pieceY * playH;
  const pw  = Math.min(cw*.88, 76);
  const ph  = Math.min(ch*.9, 70);
  const px  = W/2;
  const falling  = gstate === 'falling';
  const showCard = falling || (gstate === 'result' && resOk);

  if (showCard) {
    const alpha = (gstate==='result') ? Math.max(0, resTimer/32) : 1;
    // trail
    for (let t=3;t>=1;t--) {
      ctx.fillStyle = showHint ? cur.color+'18' : '#ffffff08';
      ctx.beginPath(); ctx.arc(px, py - t*11, 7, 0, Math.PI*2); ctx.fill();
    }
    ctx.save(); ctx.globalAlpha = alpha;
    rrect(px-pw/2, py-ph/2, pw, ph, 11);
    ctx.fillStyle = showHint ? cur.color+'30' : 'rgba(70,50,110,.5)';
    ctx.fill();
    ctx.strokeStyle = showHint ? cur.color+'99' : 'rgba(140,110,210,.65)';
    ctx.lineWidth = 2; ctx.stroke();

    if (showHint) drawShape(px, py - ph*.18, ph*.2, SHAPES[cur.si], cur.color, 8);

    const ly = showHint ? py + ph*.17 : py + ph*.06;
    ctx.fillStyle = '#fff';
    ctx.shadowColor = showHint ? cur.color : '#aaaaff'; ctx.shadowBlur = 12;
    ctx.font = `bold ${showHint ? ph*.38 : ph*.52}px monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(cur.letter, px, ly);
    ctx.shadowBlur = 0;

    if (showHint) {
      ctx.fillStyle = cur.color; ctx.font = `bold ${ph*.22}px monospace`;
      ctx.textAlign = 'right'; ctx.textBaseline = 'top';
      ctx.fillText(cur.code, px+pw/2-6, py-ph/2+5);
    }
    ctx.textBaseline = 'alphabetic'; ctx.restore();
  }

  // ---- TIME BAR ----
  if (gstate === 'falling') {
    const p = 1 - pieceY;
    const barC = p>.5 ? '#00d4aa' : p>.25 ? '#ffd700' : '#ff4444';
    ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(0, bot-3, W, 3);
    ctx.fillStyle = barC; ctx.fillRect(0, bot-3, W*p, 3);
  }

  // ---- RESULT OVERLAY ----
  if (gstate === 'result') {
    const a = Math.min(1, resTimer/18);
    if (resOk) {
      const rc = cur.si;
      ctx.fillStyle = `rgba(0,255,128,${a*.22})`; ctx.fillRect(rc*cw, topH, cw, H-topH);
      const pts = 10 * Math.min(streak,5) * level;
      ctx.fillStyle = `rgba(255,215,0,${a})`;
      ctx.font = `bold ${Math.min(W*.1,38)}px monospace`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.shadowColor='#ffd700'; ctx.shadowBlur=16;
      ctx.fillText(`+${pts}`, cx(rc), H*.45);
      if (streak >= 2) {
        ctx.font = `bold ${Math.min(W*.055,20)}px monospace`;
        ctx.fillStyle=`rgba(255,100,180,${a})`;
        ctx.fillText(`×${streak} СЕРИЯ`, cx(rc), H*.45+38);
      }
      ctx.shadowBlur=0; ctx.textBaseline='alphabetic';
    } else {
      ctx.fillStyle = `rgba(255,0,0,${a*.18})`; ctx.fillRect(0,0,W,H);
      if (tapped>=0) {
        ctx.fillStyle = `rgba(255,40,40,${a*.28})`; ctx.fillRect(tapped*cw, topH, cw, H-topH);
        ctx.fillStyle=`rgba(255,70,70,${a})`;
        ctx.font=`bold ${Math.min(cw*.55,40)}px monospace`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('✗', cx(tapped), H/2);
      }
      const rc = cur.si;
      ctx.fillStyle=`rgba(0,255,128,${a*.25})`; ctx.fillRect(rc*cw, topH, cw, H-topH);
      drawShape(cx(rc), topH+hdrH*.44, hdrH*.3, SHAPES[rc], `rgba(0,255,128,${a})`, 14*a);
      ctx.fillStyle=`rgba(0,255,128,${a})`;
      ctx.font=`bold ${Math.min(cw*.55,40)}px monospace`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('✓', cx(rc), H/2);
      ctx.fillStyle=`rgba(255,255,255,${a*.85})`;
      ctx.font=`bold ${Math.min(W*.07,27)}px monospace`;
      ctx.fillText(cur.letter, cx(rc), H/2+45);
      const [r1,g1,b1] = cur.color.slice(1).match(/../g).map(h=>parseInt(h,16));
      ctx.fillStyle=`rgba(${r1},${g1},${b1},${a*.8})`;
      ctx.font=`${Math.min(W*.04,15)}px monospace`;
      ctx.fillText(`код ${cur.code}`, cx(rc), H/2+68);
      ctx.textBaseline='alphabetic';
    }

    // death vignette
    if (deathCol >= 0) {
      const da = Math.min(.75, (90-resTimer)/90*.75);
      ctx.fillStyle = `rgba(0,0,0,${da})`; ctx.fillRect(0,0,W,H);
    }
  }

  // particles
  tickParticles();

  // ---- HINT TOGGLE (top right area) + HELP ----
  const bh = Math.min(topH*.55, 26), bw = 56, by2 = (topH-bh)/2;
  // hint toggle
  rrect(W-bw*2-14, by2, bw, bh, 6);
  ctx.fillStyle = showHint ? 'rgba(0,212,170,.25)' : 'rgba(80,60,100,.35)';
  ctx.fill();
  ctx.strokeStyle = showHint ? 'rgba(0,212,170,.7)' : 'rgba(150,120,200,.5)';
  ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle = showHint ? '#00d4aa' : '#aaaaaa';
  ctx.font=`bold ${Math.min(bh*.5,12)}px monospace`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(showHint ? 'ПОДСК.' : 'ЗАПОМ.', W-bw*2-14+bw/2, by2+bh/2);
  // help
  rrect(W-bw-8, by2, bw, bh, 6);
  ctx.fillStyle='rgba(255,215,0,.1)'; ctx.fill();
  ctx.strokeStyle='rgba(255,215,0,.35)'; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle='#ffd700';
  ctx.fillText('ТАБЛ.', W-bw-8+bw/2, by2+bh/2);
  ctx.textBaseline='alphabetic';
}

// ===================== DRAW: MENU =====================
function drawMenu() {
  ctx.fillStyle='#0a0a1a'; ctx.fillRect(0,0,W,H);

  // animated orbs
  for (const o of orbs) {
    o.x+=o.vx; o.y+=o.vy;
    if(o.x<0||o.x>W) o.vx*=-1;
    if(o.y<0||o.y>H) o.vy*=-1;
    const p = .5+.5*Math.sin(tick*.03+o.ph);
    drawShape(o.x, o.y, o.r*p, SHAPES[(o.code-1)%4], CLR[o.code], 18*p);
    ctx.globalAlpha=.55+.35*p;
    ctx.fillStyle=CLR[o.code];
    ctx.font=`bold ${o.r*.7}px monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(o.code, o.x, o.y);
    ctx.globalAlpha=1; ctx.textBaseline='alphabetic';
  }

  // overlay
  ctx.fillStyle='rgba(10,10,26,.55)'; ctx.fillRect(0,0,W,H);

  // title
  const tsz = Math.min(W*.12, 46);
  ctx.fillStyle='#ffd700'; ctx.font=`bold ${tsz}px monospace`;
  ctx.textAlign='center';
  ctx.shadowColor='#ffd700'; ctx.shadowBlur=20;
  ctx.fillText('НЕЙРО', W/2, H*.3);
  ctx.shadowBlur=0;
  ctx.fillStyle='#aaffee'; ctx.font=`bold ${tsz*.7}px monospace`;
  ctx.fillText('ТЕТРИС', W/2, H*.3+tsz*.9);

  ctx.fillStyle='rgba(255,236,139,.55)'; ctx.font=`${Math.min(W*.038,14)}px monospace`;
  ctx.fillText('запомни буквы через игру', W/2, H*.3+tsz*1.9);

  // hi score
  if (hi>0) {
    ctx.fillStyle='rgba(255,215,0,.55)'; ctx.font=`bold ${Math.min(W*.04,15)}px monospace`;
    ctx.fillText(`рекорд: ${hi}`, W/2, H*.3+tsz*2.65);
  }

  // play button
  const btnW=Math.min(W*.55,200), btnH=Math.min(H*.075,54);
  const bx=W/2-btnW/2, by=H*.55;
  rrect(bx, by, btnW, btnH, btnH/2);
  ctx.fillStyle='rgba(255,215,0,.2)'; ctx.fill();
  ctx.strokeStyle='rgba(255,215,0,.7)'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='#ffd700'; ctx.font=`bold ${Math.min(btnH*.44,20)}px monospace`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('ИГРАТЬ', W/2, by+btnH/2);
  ctx.textBaseline='alphabetic';

  // help button
  const hbW=Math.min(W*.4,140), hbH=Math.min(H*.055,40);
  const hbx=W/2-hbW/2, hby=H*.55+btnH+14;
  rrect(hbx, hby, hbW, hbH, hbH/2);
  ctx.fillStyle='rgba(100,80,160,.25)'; ctx.fill();
  ctx.strokeStyle='rgba(150,120,220,.5)'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle='rgba(200,180,255,.8)'; ctx.font=`bold ${Math.min(hbH*.44,16)}px monospace`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('ТАБЛИЦА', W/2, hby+hbH/2);
  ctx.textBaseline='alphabetic';

  // back to main
  ctx.fillStyle='rgba(255,215,0,.35)'; ctx.font=`${Math.min(W*.034,13)}px monospace`;
  ctx.fillText('← главная', W/2, H*.92);
}

// ===================== DRAW: HELP =====================
function drawHelp() {
  ctx.fillStyle='#0a0a1a'; ctx.fillRect(0,0,W,H);

  const padX = Math.min(W*.04, 14);
  const topH = Math.min(H*.08, 58);

  // header
  ctx.fillStyle='rgba(255,215,0,.12)'; ctx.fillRect(0,0,W,topH);
  ctx.fillStyle='#ffd700'; ctx.font=`bold ${Math.min(topH*.44,19)}px monospace`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('ТАБЛИЦА КОДОВ', W/2, topH/2);
  ctx.textBaseline='alphabetic';

  // shape headers
  const colW = (W - padX*2) / 4;
  const rowH = Math.min((H-topH-60) / 9, 64);
  const startY = topH + 10;

  // column headers
  for (let c=0;c<4;c++) {
    const cx = padX + c*colW + colW/2;
    const shR = rowH*.22;
    drawShape(cx, startY + shR + 2, shR, SHAPES[c], '#aaaaaa', 4);
    ctx.fillStyle='#888'; ctx.font=`${Math.min(rowH*.2,12)}px monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(SYM_OUT[c], cx, startY + shR*2.2 + 6);
    ctx.textBaseline='alphabetic';
  }
  const gridY = startY + rowH * .75;

  for (let code=1; code<=9; code++) {
    const ry = gridY + (code-1)*rowH;
    const letters = GROUPS[code];
    const color = CLR[code];

    // row bg
    ctx.fillStyle = `${color}10`;
    ctx.fillRect(padX, ry, W - padX*2, rowH - 2);

    // code number (left side)
    const numR = Math.min(rowH*.32, 18);
    drawShape(padX + numR + 2, ry + rowH/2 - 2, numR, 'circle', color, 6);
    ctx.fillStyle='#fff'; ctx.font=`bold ${numR*1.1}px monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(code, padX + numR + 2, ry + rowH/2 - 2);
    ctx.textBaseline='alphabetic';

    // letter cells
    for (let c=0;c<4;c++) {
      const letter = letters[c];
      if (!letter) continue;
      const cx = padX + c*colW + colW/2;
      const cy = ry + rowH/2;

      // shape behind letter
      const sR = Math.min(rowH*.28, 16);
      drawShape(cx, cy - 2, sR, SHAPES[c], color+'55', 0);

      // letter
      ctx.fillStyle=color;
      ctx.font=`bold ${Math.min(rowH*.46,26)}px monospace`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.shadowColor=color; ctx.shadowBlur=6;
      ctx.fillText(letter, cx, cy - 1);
      ctx.shadowBlur=0; ctx.textBaseline='alphabetic';
    }

    // divider
    ctx.strokeStyle='rgba(255,215,0,.07)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(padX, ry+rowH-1); ctx.lineTo(W-padX, ry+rowH-1); ctx.stroke();
  }

  // back button
  const bW=Math.min(W*.5,180), bH=Math.min(H*.055,38);
  const bX=W/2-bW/2, bY=H-bH-12;
  rrect(bX, bY, bW, bH, bH/2);
  ctx.fillStyle='rgba(255,215,0,.15)'; ctx.fill();
  ctx.strokeStyle='rgba(255,215,0,.45)'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle='#ffd700'; ctx.font=`bold ${Math.min(bH*.44,15)}px monospace`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('ЗАКРЫТЬ', W/2, bY+bH/2);
  ctx.textBaseline='alphabetic';
}

// ===================== DRAW: GAMEOVER =====================
function drawGameover() {
  ctx.fillStyle='#0a0a1a'; ctx.fillRect(0,0,W,H);

  // column debris
  const { bot, playH, cw, cx, ch } = L();
  for (let c=0;c<4;c++) {
    const n=stacks[c], d=n/MAX_STACK;
    for (let s=0;s<n;s++) {
      const bx=c*cw, by=bot+playH-(s+1)*ch, pad=4;
      rrect(bx+pad,by+pad,cw-pad*2,ch-pad*2,5);
      ctx.fillStyle=`rgba(${100+d*100},${30*(1-d)},${30*(1-d)},.4)`; ctx.fill();
    }
  }

  ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(0,0,W,H);

  const tsz=Math.min(W*.11,42);
  ctx.fillStyle='#ff5f5f'; ctx.font=`bold ${tsz}px monospace`;
  ctx.textAlign='center';
  ctx.shadowColor='#ff5f5f'; ctx.shadowBlur=20;
  ctx.fillText('СТОПКА!', W/2, H*.28);
  ctx.shadowBlur=0;

  ctx.fillStyle='#ffd700'; ctx.font=`bold ${tsz*.9}px monospace`;
  ctx.fillText(`★ ${score}`, W/2, H*.28+tsz*1.1);

  if (score >= hi) {
    ctx.fillStyle='#ff6b9d'; ctx.font=`bold ${tsz*.5}px monospace`;
    ctx.fillText('НОВЫЙ РЕКОРД!', W/2, H*.28+tsz*1.85);
  } else {
    ctx.fillStyle='rgba(255,215,0,.5)'; ctx.font=`${tsz*.42}px monospace`;
    ctx.fillText(`рекорд: ${hi}`, W/2, H*.28+tsz*1.85);
  }

  const acc = nTotal ? Math.round(nOk/nTotal*100) : 0;
  ctx.fillStyle='rgba(170,255,238,.75)'; ctx.font=`${tsz*.42}px monospace`;
  ctx.fillText(`точность: ${acc}%  ур. ${level}`, W/2, H*.28+tsz*2.6);

  const btnW=Math.min(W*.55,200), btnH=Math.min(H*.075,52);
  const btnX=W/2-btnW/2;

  // restart
  rrect(btnX, H*.55, btnW, btnH, btnH/2);
  ctx.fillStyle='rgba(255,215,0,.2)'; ctx.fill();
  ctx.strokeStyle='rgba(255,215,0,.7)'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='#ffd700'; ctx.font=`bold ${Math.min(btnH*.44,19)}px monospace`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('ЕЩЁ РАЗ', W/2, H*.55+btnH/2);

  // menu
  rrect(btnX, H*.55+btnH+14, btnW*.75, btnH*.8, btnH*.4);
  ctx.fillStyle='rgba(100,80,160,.25)'; ctx.fill();
  ctx.strokeStyle='rgba(150,120,220,.5)'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle='rgba(200,180,255,.8)'; ctx.font=`bold ${Math.min(btnH*.38,15)}px monospace`;
  ctx.fillText('МЕНЮ', W/2, H*.55+btnH+14+btnH*.4);
  ctx.textBaseline='alphabetic';
}

// ===================== MAIN LOOP =====================
function loop() {
  requestAnimationFrame(loop);
  tick++;

  if (screen === 'menu')     { drawMenu(); }
  else if (screen === 'help')     { drawHelp(); }
  else if (screen === 'gameover') { drawGameover(); }
  else {
    // game tick
    if (gstate === 'falling') {
      fallT++;
      pieceY = fallT / fallDur;
      if (pieceY >= 1) onTimeout();
    } else if (gstate === 'result') {
      resTimer--;
      if (resTimer <= 0) {
        if (deathCol >= 0) { screen = 'gameover'; }
        else { spawnPiece(); }
      }
    }
    drawGame();
  }
}
loop();

// ===================== INPUT =====================
function handleTap(x, y) {
  if (screen === 'menu') {
    const btnW=Math.min(W*.55,200), btnH=Math.min(H*.075,54), by=H*.55;
    // play
    if (x >= W/2-btnW/2 && x <= W/2+btnW/2 && y >= by && y <= by+btnH) { startGame(); return; }
    // help
    const hbW=Math.min(W*.4,140), hbH=Math.min(H*.055,40), hby=H*.55+btnH+14;
    if (x >= W/2-hbW/2 && x <= W/2+hbW/2 && y >= hby && y <= hby+hbH) { screen='help'; return; }
    // main page
    if (y > H*.88) { window.location.href='index.html'; return; }
    return;
  }

  if (screen === 'help') {
    const bH=Math.min(H*.055,38), bY=H-bH-12;
    if (y >= bY) { screen = (typeof _prevScreen !== 'undefined' ? _prevScreen : 'menu'); return; }
    return;
  }

  if (screen === 'gameover') {
    const btnH=Math.min(H*.075,52), y1=H*.55;
    if (y >= y1 && y <= y1+btnH) { startGame(); return; }
    const y2=y1+btnH+14, bh2=btnH*.8;
    if (y >= y2 && y <= y2+bh2) { screen='menu'; return; }
    return;
  }

  if (screen === 'game') {
    const { topH, hdrH, bot, cw } = L();
    const bh=Math.min(topH*.55,26), bw=56, by2=(topH-bh)/2;

    // hint toggle
    if (x >= W-bw*2-14 && x <= W-bw-14 && y >= by2 && y <= by2+bh) {
      showHint = !showHint; return;
    }
    // table
    if (x >= W-bw-8 && x <= W-8 && y >= by2 && y <= by2+bh) {
      _prevScreen = 'game'; screen='help'; return;
    }
    // column tap (only in play area)
    if (y < topH) return;
    const col = Math.min(3, Math.max(0, x / cw | 0));
    choose(col);
  }
}

let _prevScreen = 'menu';

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  handleTap(e.clientX, e.clientY);
}, { passive: false });

document.addEventListener('keydown', e => {
  const map = { '1':0,'2':1,'3':2,'4':3, 'ArrowLeft':0,'a':0,'A':0, 'ArrowRight':3,'d':3,'D':3 };
  if (screen==='game' && map[e.key] !== undefined) { choose(map[e.key]); return; }
  // also support q/w/e/r for 4 columns
  const qmap = { 'q':0,'Q':0, 'w':1,'W':1, 'e':2,'E':2, 'r':3,'R':3 };
  if (screen==='game' && qmap[e.key] !== undefined) { choose(qmap[e.key]); return; }
  if (e.key === 'Escape') {
    if (screen==='game') screen='menu';
    else if (screen==='help') screen=_prevScreen;
    else if (screen==='gameover') screen='menu';
  }
  if ((e.key===' '||e.key==='Enter') && screen==='menu') startGame();
  if ((e.key===' '||e.key==='Enter') && screen==='gameover') startGame();
});
</script>
